<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#140E0A">
<title>黄牛模拟器 · 第一章 手机试玩</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥢</text></svg>">
<style>
/* ============================================================================
   app.css - 网页复刻版样式
   两块视觉语言：
     剧情/结算 = 市井暗金（对齐 scripts/core/Theme.lua 的 market 色板）
     取号界面 = 饱了么 App 壳（对齐 scripts/ui/shells/Bao.lua 的色值）
   ============================================================================ */

:root {
  --bg: #140E0A;
  --bg-deep: #0C0806;
  --card: #261B12;
  --card-soft: #342619;
  --line: #604824;
  --gold: #FFC93C;
  --gold-dim: #C4942C;
  --gold-soft: #FFE49E;
  --text: #F5E7C8;
  --dim: #B09A7A;
  --ink: #120D09;
  --success: #4AD17A;
  --warn: #FFA83C;
  --danger: #FF584A;

  --bao-bg: #FFF8F3;
  --bao-card: #FFFFFF;
  --bao-line: #F0E4DA;
  --bao-brand: #FF6A00;
  --bao-brand-dk: #D95400;
  --bao-text: #241A14;
  --bao-dim: #9A8878;
  --bao-danger: #E23234;
  --bao-warn: #F09B2A;
  --bao-track: #F1E7DD;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-deep);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "MiSans", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.screen {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;          /* 让子元素可以被约束在视口内（不要用 vh 撑） */
}

/* ============================== 剧情 / 结算（暗金） ======================= */

.dark {
  overflow-y: auto;       /* 内容超长时在屏内滚，不把页面顶高 */
  background: radial-gradient(120% 90% at 50% 0%, #1E150E 0%, var(--bg-deep) 70%);
  padding: calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
  gap: 10px;
}

.hud {
  display: flex;
  gap: 10px;
  justify-content: space-between;
  padding: 8px 12px;
  background: rgba(38, 27, 18, 0.72);
  border: 1px solid rgba(96, 72, 36, 0.9);
  border-radius: 12px;
}
.hud .cell { display: flex; flex-direction: column; align-items: center; gap: 1px; flex: 1; }
.hud .v { font-size: 13px; font-weight: 700; color: var(--gold-soft); }
.hud .k { font-size: 10px; color: var(--dim); }
.hud .v.danger { color: var(--danger); }
.hud .v.warn { color: var(--warn); }
.hud .v.ok { color: var(--success); }

.speedline { font-size: 11px; color: var(--dim); margin: -4px 2px 0; }

.talk {
  position: relative;
  background: linear-gradient(180deg, rgba(52, 38, 25, 0.96), rgba(38, 27, 18, 0.96));
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.talk.sys {
  border-color: var(--gold);
  background: linear-gradient(180deg, rgba(66, 46, 20, 0.96), rgba(40, 28, 16, 0.96));
}
.talk-head { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700;
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  background: rgba(255, 201, 60, 0.09);
}
.talk.sys .avatar { color: var(--gold); }
.talk-who { display: flex; flex-direction: column; gap: 2px; }
.talk-who .name { font-size: 13px; font-weight: 700; color: var(--gold-soft); }
.talk.sys .talk-who .name { color: var(--gold); }
.talk-who .sub { font-size: 10px; color: var(--dim); }
.hairline { height: 1px; background: rgba(96, 72, 36, 0.7); }

.talk-text {
  font-size: 15px;
  line-height: 1.62;
  color: var(--text);
  white-space: pre-wrap;
  min-height: 3.2em;
}

.hero-title {
  text-align: center;
  font-size: 40px;
  font-weight: 700;
  letter-spacing: 5px;
  color: rgba(255, 201, 60, 0.92);
  margin: 12vh 0 5vh;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
}

.watermark {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  font-weight: 700;
  letter-spacing: 6px;
  color: rgba(255, 201, 60, 0.10);
  user-select: none;
}

.actions { display: flex; flex-direction: column; gap: 8px; }

.btn,
.bao-tap {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  min-height: 52px;
  border-radius: 12px;
  border: 1px solid transparent;
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;        /* 去掉移动端 300ms 点击延迟 */
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.07s ease, background-color 0.12s ease, opacity 0.12s ease;
}

.btn {
  font-size: 16px;
  font-weight: 700;
}

/* 按下就缩一点点：手机上要能"摸"到反馈 */
.btn:active,
.bao-tap:active { transform: scale(0.985); }

/* 不能点的时候必须看得出来，否则会以为"点了没反应" */
.btn:disabled,
.bao-tap:disabled {
  opacity: 0.45;
  transform: none;
  cursor: default;
}
.btn-primary { background: var(--gold); color: var(--ink); }
.btn-primary:active { background: var(--gold-dim); }
.btn-ghost {
  min-height: 48px;
  background: rgba(52, 38, 25, 0.66);
  color: var(--gold-soft);
  border-color: rgba(196, 148, 44, 0.7);
  font-weight: 500;
  font-size: 14px;
  text-align: left;
  padding: 12px 14px;
}
.btn-ghost:active { background: rgba(66, 48, 30, 0.9); }
.btn-mini {
  min-height: 34px; width: auto; padding: 0 14px;
  font-size: 12px; border-radius: 17px;
  background: rgba(52, 38, 25, 0.8); color: var(--gold-soft);
  border: 1px solid rgba(196, 148, 44, 0.6);
}

/* 结算 */
.chips { display: flex; gap: 8px; }
.chip {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.chip .tag {
  font-size: 11px; padding: 3px 8px; border-radius: 999px;
  border: 1px solid currentColor;
}
.chip .num { font-size: 10px; color: var(--dim); }

.rows { display: flex; flex-direction: column; }
.row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; gap: 12px;
  font-size: 13px; color: var(--dim);
}
.row .v { color: var(--text); }
.row .v.gold { color: var(--gold); font-weight: 700; }
.row.total .k { color: var(--gold); }
.row.total .v { color: var(--gold); font-size: 20px; font-weight: 700; }

.verdict { font-size: 22px; font-weight: 700; }
.verdict.ok { color: var(--success); }
.verdict.fail { color: var(--danger); }

/* ============================== 饱了么 App 壳 ============================= */

.bao {
  background: var(--bao-bg);
  color: var(--bao-text);
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  overflow: hidden;          /* 页面本身不滚，只有中间内容滚 */
}

/* 中间可滚动区：门店卡 / 取号区 / 须知 */
.bao-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 8px;
}

.bao-status {
  display: flex; justify-content: space-between; align-items: center;
  padding: calc(6px + env(safe-area-inset-top)) 16px 2px;
  font-size: 12px; color: var(--bao-text);
}
.bao-status .right { color: var(--bao-text); }

.bao-nav {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 8px 16px 10px;
}
.bao-nav .back { font-size: 22px; line-height: 1; color: var(--bao-text); }
.bao-nav .title { font-size: 16px; font-weight: 700; }
.bao-nav .fav { font-size: 13px; color: var(--bao-dim); }

.bao-account {
  display: flex; gap: 10px; padding: 0 16px 8px;
  font-size: 11px; color: var(--bao-dim);
}

.bao-card {
  background: var(--bao-card);
  border-radius: 12px;
  margin: 0 12px;
  padding: 12px 16px 12px 12px;   /* 右边多留 4px：中文自动宽度测量补偿 */
  display: flex; flex-direction: column;
  gap: 6px;
}
.bao-card + .bao-card { margin-top: 10px; }

.shop-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.shop-score { font-size: 12px; font-weight: 700; color: var(--bao-brand); }
.shop-badge { font-size: 11px; color: var(--bao-dim); }
.spacer { flex: 1; }
.pill {
  font-size: 11px; padding: 3px 8px; border-radius: 4px;
  color: var(--bao-brand); background: rgba(255, 106, 0, 0.10);
}
.shop-name { font-size: 20px; font-weight: 700; line-height: 1.25; }
.shop-addr { font-size: 12px; color: var(--bao-dim); }
.photo {
  position: relative;
  height: 84px; border-radius: 8px; overflow: hidden;
  background: linear-gradient(135deg, #ECE2D8, #D0C2B6);
}
.photo .art { position: absolute; inset: 0; width: 100%; height: 100%; }

.calling-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.calling-label { font-size: 11px; color: var(--bao-dim); }
.calling-no { font-size: 30px; font-weight: 700; line-height: 1.1; }
.queue-col { text-align: right; display: flex; flex-direction: column; gap: 2px; }
.queue-col .a { font-size: 12px; color: var(--bao-dim); }
.queue-col .b { font-size: 12px; color: var(--bao-text); }
.gap8 { height: 8px; }

.kv {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 8px 0;
  font-size: 13px; color: var(--bao-dim);
}
.kv .v { color: var(--bao-text); text-align: right; }

.stock-row {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 8px 4px 0 0;
  border-top: 1px solid var(--bao-line);
  font-size: 12px; color: var(--bao-dim);
}
.stock { font-size: 13px; font-weight: 700; color: var(--bao-brand); }

.notes { padding: 12px 16px 0; display: flex; flex-direction: column; gap: 6px; }
.notes .t { font-size: 13px; font-weight: 700; }
.notes .i { font-size: 12px; color: var(--bao-dim); line-height: 1.5; }

/* 底部读秒条 */
.bao-bottom {
  flex: 0 0 auto;            /* 永远钉在屏幕底部，不用滚 */
  background: var(--bao-card);
  border-top: 1px solid var(--bao-line);
  border-radius: 16px 16px 0 0;
  padding: 8px 14px calc(10px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 5px;
}
.clock-row { display: flex; align-items: flex-end; justify-content: space-between; }
.clock-label { font-size: 11px; color: var(--bao-dim); }
.clock { font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.clock.hot { color: var(--bao-brand); }
.judge-col { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.attempt { font-size: 11px; color: var(--bao-dim); }
.judge { font-size: 13px; font-weight: 700; color: var(--bao-danger); min-height: 18px; }

.track-wrap { position: relative; }
.track {
  position: relative; height: 12px; border-radius: 6px;
  background: var(--bao-track); overflow: hidden;
}
.zone {
  position: absolute; right: 0; top: 0; bottom: 0;
  background: rgba(255, 106, 0, 0.24);
}
.zone-core {
  position: absolute; right: 0; top: 0; bottom: 0;
  background: rgba(255, 106, 0, 0.75);
}
.marker {
  position: absolute; top: 0; bottom: 0; width: 8px; border-radius: 4px;
  background: var(--bao-text); will-change: left;
}
.legend { display: flex; justify-content: space-between; font-size: 9px; color: var(--bao-dim); }
.legend .gold { color: var(--bao-brand); }

.bao-tap {
  width: calc(100% - 12px);
  margin: 1px 6px 0;
  min-height: 46px;
  height: 46px;
  border-radius: 999px;          /* 胶囊，不再是一条横贯屏幕的大板子 */
  background: var(--bao-brand);
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 1px;
  box-shadow: 0 6px 14px rgba(255, 106, 0, 0.26);
}
.bao-tap:active {
  background: var(--bao-brand-dk);
  transform: scale(0.96);
  box-shadow: 0 2px 6px rgba(255, 106, 0, 0.3);
}
/* 禁用态：直接换成中性灰底，不用半透明糊弄（半透明橙看着还像能点） */
.bao-tap:disabled {
  opacity: 1;
  background: #F0E3D8;
  color: #B3A094;
  box-shadow: none;
  transform: none;
}
.bao-foot { font-size: 10px; color: var(--bao-dim); text-align: center; }

.trap {
  position: absolute; right: 16px; top: 43%;
  background: var(--bao-warn); color: #fff;
  border: 0; border-radius: 20px; height: 40px; padding: 0 16px;
  font-size: 12px; font-weight: 700; font-family: inherit;
  box-shadow: 0 6px 16px rgba(240, 155, 42, 0.35);
  animation: pop 0.18s ease-out;
}
@keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* 提示条 */
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
  background: rgba(18, 13, 9, 0.92); color: #F5E7C8;
  border: 1px solid rgba(196, 148, 44, 0.6);
  padding: 9px 14px; border-radius: 999px; font-size: 12px;
  max-width: 84vw; text-align: center; z-index: 40;
  animation: toastIn 0.16s ease-out;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* 矮屏（320×568 / 360×640 这类）：把门店图位和留白压小，保证读秒条不挤 */
@media (max-height: 700px) {
  .photo { height: 62px; }
  .bao-card { padding-top: 10px; padding-bottom: 10px; }
  .notes { padding-top: 8px; gap: 4px; }
  .clock { font-size: 28px; }
  .bao-tap { min-height: 44px; height: 44px; font-size: 16px; }
}

/* ---- 人机验证卡片（T1-2：秒杀时刻 + 验证码）---- */
.captcha-card { margin-top: 10px; border: 1px solid var(--bao-line); }
.captcha-inst { font-size: 12px; line-height: 1.6; color: var(--bao-text); }
.captcha-inst b { font-size: 13px; }
.captcha-taunt { color: var(--bao-dim); font-size: 11px; }
.captcha-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 10px;
}
.captcha-tile {
  -webkit-appearance: none;
  appearance: none;
  height: 46px;
  border-radius: 10px;
  border: 1px solid var(--bao-line);
  background: #FFFDFB;
  color: var(--bao-text);
  font-family: inherit;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.07s ease, background-color 0.12s ease, color 0.12s ease;
}
.captcha-tile:active { transform: scale(0.95); background: #FFF0E6; }
.captcha-tile.hit {
  background: rgba(255, 106, 0, 0.12);
  border-color: var(--bao-brand);
  color: var(--bao-brand);
}
.captcha-tile:disabled { opacity: 0.55; }

/* 验证阶段：整屏一个卡片，垂直居中一点 */
.captcha-wrap {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8px 12px 16px;
}
.captcha-wrap .bao-card { margin: 0; }

/* ============================================================================
   波波（潮玩抽签）—— 同一套骨架，只换色板：
   紫底 + 亮黄主色 + 冷紫描边，对应 scripts/ui/shells/Bobo.lua 的 COL
   ============================================================================ */
.bobo {
  --bao-bg: #181228;
  --bao-card: #261E3C;
  --bao-line: #443868;
  --bao-brand: #FFD642;
  --bao-brand-dk: #E2B622;
  --bao-text: #F4F0FF;
  --bao-dim: #A498C8;
  --bao-danger: #FF6076;
  --bao-warn: #A874FF;
  --bao-track: #362C54;
  background: var(--bao-bg);
  color: var(--bao-text);
}
.bobo .bao-tap { color: #2A1E00; }         /* 亮黄底配深字 */
.bobo .zone { background: rgba(255, 214, 66, 0.22); }
.bobo .zone-core { background: rgba(255, 214, 66, 0.8); }
.bobo .marker { background: #F4F0FF; }
.bobo .pill { background: rgba(255, 214, 66, 0.14); }
.bobo .stock { color: var(--bao-brand); }
.bobo .trap { background: var(--bao-warn); }

/* 商品图位：渐变底 + 限量文案 */
.bobo-item { gap: 8px; }
.item-art {
  position: relative;
  height: 150px;
  border-radius: 10px;
  overflow: hidden;
  background: linear-gradient(135deg, #5C38A8 0%, #201838 100%);
}
.item-art .art { position: absolute; inset: 0; width: 100%; height: 100%; }
.item-art-cap {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-shadow: 0 1px 6px rgba(10, 6, 20, 0.8);
}
.item-art-title {
  font-size: 19px;
  font-weight: 700;
  color: #FFF0FF;
}
.item-art-sub { font-size: 11px; color: rgba(232, 214, 255, 0.85); }


.bobo-sep { height: 1px; background: var(--bao-line); margin: 6px 0; }
.bobo-sub { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
.bobo .store-row { padding: 6px 0; }
.bobo .v.hot { color: var(--bao-brand); }
.bobo .v.out { color: var(--bao-dim); }
.bobo .captcha-tile { background: #2E2548; border-color: #443868; color: var(--bao-text); }
.bobo .captcha-tile.hit { background: rgba(255, 214, 66, 0.16); border-color: var(--bao-brand); color: var(--bao-brand); }

/* ---- 波波：开签倒计时横幅 + 门店选择 + 抽签结果卡 ---- */
.bobo-banner {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 10px 12px 0;
  padding: 10px 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(255, 214, 66, 0.16), rgba(168, 116, 255, 0.14));
  border: 1px solid rgba(255, 214, 66, 0.35);
}
.bobo-banner .countdown {
  font-size: 22px;
  font-weight: 700;
  color: var(--bao-brand);
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
}
.bobo-banner .banner-sub { font-size: 11px; color: var(--bao-dim); }

.store-pick {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  margin: 3px 0;
  border-radius: 10px;
  border: 1px solid transparent;
  background: rgba(255, 255, 255, 0.03);
  color: var(--bao-text);
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
}
.store-pick .dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--bao-line);
  flex: 0 0 auto;
}
.store-pick .nm { flex: 1 1 auto; }
.store-pick .st { font-size: 12px; }
.store-pick .st.hot { color: var(--bao-brand); }
.store-pick .st.out { color: var(--bao-dim); }
.store-pick.on {
  border-color: var(--bao-brand);
  background: rgba(255, 214, 66, 0.10);
}
.store-pick.on .dot {
  border-color: var(--bao-brand);
  background: var(--bao-brand);
  box-shadow: inset 0 0 0 3px #2A1E3E;
}
.store-pick.off { opacity: 0.55; }

.draw-result {
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border: 1px solid rgba(196, 148, 44, 0.5);
  background: rgba(52, 38, 25, 0.6);
}
.draw-result.win { border-color: rgba(74, 209, 122, 0.6); background: rgba(30, 60, 40, 0.45); }
.draw-result.lose { border-color: rgba(255, 88, 74, 0.4); }
.draw-title { font-size: 15px; font-weight: 700; color: var(--gold-soft); }
.draw-result.win .draw-title { color: var(--success); }
.draw-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--dim);
}
.draw-row .v { color: var(--text); }
.draw-row .v.pay { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
.draw-note { font-size: 10px; color: var(--dim); }

/* ---- 连点抢票（rapid）：进度条 + 计数 ---- */
.rapid-track { position: relative; overflow: hidden; }
.rapid-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 0%;
  background: linear-gradient(90deg, var(--bao-brand), var(--bao-brand-dk));
  border-radius: 6px;
  transition: width 0.06s linear;
}
.rapid-num {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--bao-dim);
  font-variant-numeric: tabular-nums;
}

/* ============================================================================
   猫瞳（演出票）—— 近黑底 + 荧光粉主色 + 香槟金点缀
   对应 scripts/ui/shells/Mao.lua 的 COL
   ============================================================================ */
.mao {
  --bao-bg: #0C0C11;
  --bao-card: #181820;
  --bao-line: #2E2E3A;
  --bao-brand: #FF3D7F;
  --bao-brand-dk: #C62860;
  --bao-text: #F0F0F6;
  --bao-dim: #8C8C9C;
  --bao-danger: #FF5660;
  --bao-warn: #F6C974;
  --bao-track: #24242E;
  background: var(--bao-bg);
  color: var(--bao-text);
}
.mao .bao-tap { color: #FFFFFF; }
.mao .pill { background: rgba(255, 61, 127, 0.14); color: var(--bao-brand); }
.mao .stock { color: var(--bao-brand); }
.mao .zone { background: rgba(255, 61, 127, 0.22); }
.mao .zone-core { background: rgba(255, 61, 127, 0.8); }
.mao .marker { background: #F0F0F6; }
.mao .rapid-fill { background: linear-gradient(90deg, #FF3D7F, #C62860); }
.mao .trap { background: #F6C974; color: #2A1E00; }

.mao-poster { padding: 0; overflow: hidden; border-radius: 14px; }
.poster-bg {
  position: relative;
  height: 168px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 4px;
  background: linear-gradient(135deg, #6B1236 0%, #14101E 72%);
}
.poster-bg::after {
  content: '';
  position: absolute; right: -40px; top: -30px;
  width: 180px; height: 180px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 61, 127, 0.45), rgba(255, 61, 127, 0));
}
.poster-tag {
  position: relative;
  align-self: flex-start;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(255, 61, 127, 0.22);
  color: #FFB3CC;
}
.poster-tag.gold {
  position: absolute; left: 76px; top: 14px;
  background: rgba(246, 201, 116, 0.18);
  color: #F6C974;
}
.poster-name {
  position: relative;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #FFFFFF;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
}
.poster-sub { position: relative; font-size: 11px; color: rgba(240, 220, 235, 0.85); }

.seat-map { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 6px; }
.seat-row { display: flex; gap: 4px; justify-content: center; }
.seat {
  width: 13px; height: 13px; border-radius: 3px;
  background: rgba(255, 61, 127, 0.55);
}
.seat.lock { background: #2E2E3A; }
.seat-legend { font-size: 10px; color: var(--bao-dim); text-align: center; margin-bottom: 6px; }

/* ============================================================================
   倒倒（二手出货）—— 暖白底 + 交易黄 + 价格红，对应 scripts/ui/shells/Dao.lua
   ============================================================================ */
.dao {
  --bao-bg: #F2F2F4;
  --bao-card: #FFFFFF;
  --bao-line: #E4E4E8;
  --bao-brand: #FFB000;
  --bao-brand-dk: #DE9600;
  --bao-text: #1E1E22;
  --bao-dim: #8A8A92;
  --bao-danger: #E83A2E;
  --bao-warn: #16A06A;
  --bao-track: #ECECF0;
  background: var(--bao-bg);
  color: var(--bao-text);
}
.dao .bao-tap { color: #2A1B00; }
.dao .zone { background: rgba(255, 176, 0, 0.22); }
.dao .zone-core { background: rgba(255, 176, 0, 0.78); }
.dao .marker { background: #1E1E22; }
.dao .rapid-fill { background: linear-gradient(90deg, #FFB000, #DE9600); }
.dao .pill { background: rgba(255, 176, 0, 0.14); color: #8A5A00; }
.dao .pill.ok { background: rgba(22, 160, 106, 0.12); color: #16A06A; }
.dao .stock { color: var(--bao-danger); }
.dao .trap { background: var(--bao-danger); color: #fff; }

.dao-search { padding: 8px 12px; }
.search-row { display: flex; align-items: center; gap: 10px; }
.search-row .back { font-size: 20px; }
.search-box {
  flex: 1 1 auto;
  height: 32px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-radius: 16px;
  background: #ECECF0;
  font-size: 13px;
  color: #3A3A40;
}
.search-row .wallet { font-size: 11px; color: var(--bao-dim); }

.dao-item { gap: 8px; }
.dao-art { position: relative; height: 130px; border-radius: 10px; overflow: hidden; }
.dao-art .art { position: absolute; inset: 0; width: 100%; height: 100%; }
.dao-badge {
  position: absolute;
  left: 10px;
  top: 10px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(232, 58, 46, 0.9);
  color: #fff;
}
.dao-price-row { display: flex; align-items: baseline; gap: 8px; }
.dao-price { font-size: 26px; font-weight: 700; color: var(--bao-danger); }
.dao-original { font-size: 11px; color: var(--bao-dim); text-decoration: line-through; }
.dao-state { font-size: 12px; font-weight: 700; color: var(--bao-danger); }
.dao-title { font-size: 14px; line-height: 1.45; }
.dao-tags { display: flex; gap: 6px; flex-wrap: wrap; }

.dao-seller { flex-direction: row; align-items: center; gap: 10px; }
.dao-seller .avatar {
  width: 36px;
  height: 36px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #FFE8B0;
  color: #8C6000;
  font-size: 15px;
  font-weight: 700;
  border: 0;
}
.seller-info { display: flex; flex-direction: column; gap: 2px; }
.seller-info .nm { font-size: 13px; }
.seller-info .sub { font-size: 10px; color: var(--bao-dim); }
.dao-watch { font-size: 11px; color: var(--bao-dim); }

/* ============================================================================
   铁行（春运火车票）—— 冷蓝白 + 票务蓝，对应 scripts/ui/shells/Tie.lua
   ============================================================================ */
.tie {
  --bao-bg: #F4F7FB;
  --bao-card: #FFFFFF;
  --bao-line: #E2E9F2;
  --bao-brand: #2060B2;
  --bao-brand-dk: #16488A;
  --bao-text: #18202C;
  --bao-dim: #7E8C9E;
  --bao-danger: #D63A34;
  --bao-warn: #E28A1E;
  --bao-track: #E4EBF3;
  background: var(--bao-bg);
  color: var(--bao-text);
}
.tie .bao-tap { color: #FFFFFF; }
.tie .zone { background: rgba(32, 96, 178, 0.18); }
.tie .zone-core { background: rgba(32, 96, 178, 0.75); }
.tie .marker { background: #18202C; }
.tie .rapid-fill { background: linear-gradient(90deg, #2060B2, #16488A); }
.tie .pill { background: rgba(32, 96, 178, 0.10); color: #2060B2; }
.tie .pill.dim { background: #EEF2F7; color: #56637A; }
.tie .stock { color: var(--bao-brand); }
.tie .trap { background: var(--bao-warn); color: #fff; }

.tie-trip { gap: 8px; }
.trip-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.trip-row .end { display: flex; flex-direction: column; gap: 2px; }
.trip-row .end.right { align-items: flex-end; }
.trip-row .city { font-size: 18px; font-weight: 700; }
.trip-row .time { font-size: 10px; color: var(--bao-dim); }
.trip-row .mid { font-size: 11px; color: var(--bao-dim); padding-bottom: 4px; }
.tie-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tie-tags .spacer { flex: 1 1 auto; }

.tie-sub { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.train-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--bao-line);
}
.train-row:last-of-type { border-bottom: 0; }
.train-l { display: flex; flex-direction: column; gap: 2px; }
.train-l .no { font-size: 14px; font-weight: 700; }
.train-l .span { font-size: 11px; color: var(--bao-dim); }
.train-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.train-r .price { font-size: 13px; font-weight: 700; color: var(--bao-danger); }
.train-r .note { font-size: 10px; }
.train-r .note.ok { color: var(--bao-brand); }
.train-r .note.no { color: var(--bao-dim); }

/* ============================================================================
   短视频加速页 —— 假信息流：卡片 + 扫描线 + 右侧互动栏 + 底部话术
   ============================================================================ */
.boost {
  background: #0B0B0F;
  color: #F2F2F5;
  padding: calc(8px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  gap: 10px;
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  overflow: hidden;
}
.boost-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.boost-title { font-size: 15px; font-weight: 700; }
.boost-left {
  font-size: 12px;
  color: #FFB84D;
  font-variant-numeric: tabular-nums;
}

.boost-feed { flex: 1 1 auto; min-height: 0; display: flex; }
.boost-card {
  position: relative;
  flex: 1 1 auto;
  border-radius: 16px;
  overflow: hidden;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.boost-scan {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    180deg,
    rgba(255, 255, 255, 0.06) 0px,
    rgba(255, 255, 255, 0.06) 1px,
    transparent 1px,
    transparent 4px
  );
  animation: boostScan 1.6s linear infinite;
}
@keyframes boostScan {
  from { transform: translateY(-6%); }
  to { transform: translateY(6%); }
}
.boost-side {
  position: absolute;
  right: 10px;
  bottom: 84px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
  font-size: 11px;
  line-height: 1.35;
  color: rgba(255, 255, 255, 0.85);
  text-align: center;
}
.boost-cap {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.boost-cap .tag {
  align-self: flex-start;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.18);
}
.boost-cap .txt {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.4;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
}
.boost-cap .dots { display: flex; gap: 4px; }
.bdot {
  width: 16px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.3);
}
.bdot.on { background: #FFD642; }

.boost-tip { font-size: 10px; color: #8B8B96; text-align: center; }
.boost-act { display: flex; flex-direction: column; gap: 8px; }

/* 取号/抢票页里的加速小条 */
.boost-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 2px;
}
.boost-row .boost-done { font-size: 10px; color: var(--bao-dim); }
.boost-row .boost-on {
  font-size: 11px;
  font-weight: 700;
  color: var(--bao-brand);
}

/* ---- 多线抢票：三个场次窗口，点亮就点 ---- */
.multi-lanes { display: flex; flex-direction: column; gap: 6px; }
.multi-lane {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid var(--bao-line);
  background: var(--bao-card);
  color: var(--bao-text);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.06s ease, background-color 0.1s ease, border-color 0.1s ease;
}
.multi-lane .ls { font-size: 11px; color: var(--bao-dim); }
.multi-lane.lit {
  border-color: var(--bao-brand);
  background: rgba(255, 61, 127, 0.14);
  transform: scale(1.01);
  animation: lanePulse 0.5s ease-in-out infinite alternate;
}
.mao .multi-lane.lit { background: rgba(255, 61, 127, 0.16); }
.bao .multi-lane.lit { background: rgba(255, 106, 0, 0.12); border-color: var(--bao-brand); }
.tie .multi-lane.lit { background: rgba(32, 96, 178, 0.12); border-color: var(--bao-brand); }
.dao .multi-lane.lit { background: rgba(255, 176, 0, 0.16); border-color: var(--bao-brand); }
.bobo .multi-lane.lit { background: rgba(255, 214, 66, 0.14); border-color: var(--bao-brand); }
.multi-lane.lit .ls { color: var(--bao-brand); font-weight: 700; }
@keyframes lanePulse {
  from { box-shadow: 0 0 0 rgba(0, 0, 0, 0); }
  to { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18); }
}
.multi-hint {
  font-size: 10px;
  color: var(--bao-dim);
  text-align: center;
  margin-top: 2px;
}

/* ============================================================================
   滑块选座（slide）+ 验真票（spot）
   ============================================================================ */
.slide-track {
  position: relative;
  height: 44px;
  border-radius: 10px;
  background: var(--bao-track);
  border: 1px solid var(--bao-line);
  touch-action: none;
  cursor: pointer;
  overflow: hidden;
}
.slide-zone {
  position: absolute;
  top: 0;
  bottom: 0;
  background: color-mix(in srgb, var(--bao-brand) 26%, transparent);
  background: rgba(255, 255, 255, 0.28);
  border-left: 1px dashed var(--bao-brand);
  border-right: 1px dashed var(--bao-brand);
}
.slide-core {
  position: absolute;
  top: 0;
  bottom: 0;
  background: var(--bao-brand);
  opacity: 0.55;
}
.slide-knob {
  position: absolute;
  top: 50%;
  width: 22px;
  height: 22px;
  margin-top: -11px;
  border-radius: 50%;
  background: #FFFFFF;
  border: 3px solid var(--bao-brand);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
  pointer-events: none;
}

.spot-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.spot-card {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  height: 52px;
  border-radius: 8px;
  border: 1px solid var(--bao-line);
  background: var(--bao-card);
  color: var(--bao-text);
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.06s ease, border-color 0.12s ease, background-color 0.12s ease;
}
.spot-card:active { transform: scale(0.96); }
.spot-card .tk { font-size: 16px; }
.spot-card .mark { font-size: 12px; color: #C9A227; }
.spot-card.ok {
  border-color: #16A06A;
  background: rgba(22, 160, 106, 0.12);
}
.spot-card.bad {
  border-color: var(--bao-danger);
  background: rgba(232, 58, 46, 0.10);
}
.bobo .spot-card .mark { color: #FFD642; }
.mao .spot-card { background: #1B1B24; }
.dao .spot-card { background: #FFFFFF; }

/* ---- 凑人头报名（crowd）：2×4 人头卡 + 预估中签率 ---- */
.crowd-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.crowd-card {
  -webkit-appearance: none;
  appearance: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px;
  border-radius: 10px;
  border: 1px solid var(--bao-line);
  background: var(--bao-card);
  color: var(--bao-text);
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.06s ease, border-color 0.12s ease, background-color 0.12s ease;
}
.crowd-card:active { transform: scale(0.96); }
.crowd-card .who {
  width: 26px;
  height: 26px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  background: rgba(168, 116, 255, 0.18);
  color: var(--bao-brand);
}
.crowd-card .nm { font-size: 10px; }
.crowd-card .st { font-size: 9px; color: var(--bao-dim); }
.crowd-card.on {
  border-color: var(--bao-brand);
  background: rgba(255, 214, 66, 0.14);
}
.crowd-card.on .st { color: var(--bao-brand); }
.crowd-card.busy { opacity: 0.5; }

/* ---- 黄牛反制（report）：候选转票帖 + 举报 / 正常 ---- */
.report-list { display: flex; flex-direction: column; gap: 6px; }
.report-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--bao-line);
  background: var(--bao-card);
}
.report-row .txt { flex: 1 1 auto; font-size: 11px; line-height: 1.4; }
.report-row .report-acts { display: flex; gap: 6px; flex: 0 0 auto; }
.report-btn,
.report-skip {
  -webkit-appearance: none;
  appearance: none;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  height: 30px;
  padding: 0 10px;
  border-radius: 15px;
  cursor: pointer;
  touch-action: manipulation;
}
.report-btn { border: 0; background: var(--bao-danger); color: #fff; }
.report-skip { border: 1px solid var(--bao-line); background: transparent; color: var(--bao-dim); }
.report-row .report-st { font-size: 10px; color: var(--bao-dim); flex: 0 0 auto; }
.report-row.hit { border-color: #16A06A; background: rgba(22, 160, 106, 0.10); }
.report-row.hit .report-st { color: #16A06A; }
.report-row.miss { border-color: var(--bao-danger); background: rgba(232, 58, 46, 0.08); }
.report-row.miss .report-st { color: var(--bao-danger); }
.mao .report-row { background: #17171F; }
.mao .report-btn { background: #FF6076; }

/* ---- 门店核销（verify）：核销码 + 数字键盘 ---- */
.verify-box { text-align: center; margin-bottom: 6px; }
.verify-code {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 6px;
  font-variant-numeric: tabular-nums;
  color: var(--bao-brand);
}
.verify-sub { font-size: 10px; color: var(--bao-dim); margin-top: 2px; }
.verify-pad {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.verify-key {
  -webkit-appearance: none;
  appearance: none;
  height: 44px;
  border-radius: 10px;
  border: 1px solid var(--bao-line);
  background: var(--bao-card);
  color: var(--bao-text);
  font-family: inherit;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.06s ease, background-color 0.1s ease;
}
.verify-key:active { transform: scale(0.94); background: rgba(255, 214, 66, 0.18); }
.mao .verify-key { background: #1B1B24; }
.mao .verify-key:active { background: rgba(255, 61, 127, 0.22); }

/* ---- 代排队（queue）：队伍格子 + 往前挪 / 拦住插队 ---- */
.queue-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.queue-pos { font-size: 12px; color: var(--bao-dim); }
.queue-pos b { font-size: 18px; color: var(--bao-brand); }
.queue-cells { display: flex; gap: 3px; }
.queue-cell {
  flex: 1 1 auto;
  height: 16px;
  border-radius: 3px;
  background: var(--bao-track);
}
.queue-cell.ahead { background: rgba(255, 106, 0, 0.28); }
.queue-cell.me { background: var(--bao-brand); }

.title-screen .rain { animation: rainFall 1.6s linear infinite; }
@keyframes rainFall { from { transform: translateY(-30px); } to { transform: translateY(30px); } }

      { id: 'reported', title: '同行恶意举报', desc: '九头鸟残部举报你的账号"异常操作"。平台罚单来得比外卖还快。', weight: 8, rarity: 'common',
        options: [{ label: '交罚款（-¥1500，风控+5）', cost: 1500 }] },
      { id: 'dampStock', title: '囤货受潮', desc: '出租屋漏水，泡了一箱货。受潮的那件，看着就心塞。', weight: 7, rarity: 'common',
        options: [{ label: '唉，认栽', cost: 0 }] },
      { id: 'auditFreeze', title: '平台抽查冻结', desc: '"您的账户存在异常，已临时冻结部分资金。"——客服的微笑隔着屏幕都能听见。', weight: 6, rarity: 'common',
        options: [{ label: '认了（冻结资金 5%）', cost: 0 }] },
      { id: 'relativeBorrow', title: '亲戚借钱', desc: '八竿子打不着的表叔突然嘘寒问暖，三句话绕到"周转五千"。最后谈成一千。', weight: 5, rarity: 'uncommon',
        options: [{ label: '借！（-¥1000，良心值+2）', cost: 1000, conscience: 2 }, { label: '哭穷拒绝（良心值-1）', cost: 0, conscience: -1 }] },
      { id: 'fanCrowdfund', title: '粉丝众筹应援', desc: '粉丝站给你集资买了新键盘，附赠一面"韭神大大冲冲冲"的锦旗。锦旗有点羞耻，但键盘是真的好用。', weight: 4, rarity: 'uncommon',
        options: [{ label: '收下（+¥800，风控+3）', gain: 800, risk: 3 }, { label: '婉拒退回', gain: 0 }] },
      { id: 'fakeSwap', title: '假货调包', desc: '上游发来的货里混进一件高仿。哪件？天知道。', weight: 4, rarity: 'uncommon',
        options: [{ label: '花 ¥800 请老师傅鉴定（揪出假货）', cost: 800 }, { label: '赌一把，不鉴定', cost: 0 }] },
      { id: 'taxiScam', title: '出租车发票骗局', desc: '司机大哥一张嘴就是两百块"高速费"。你据理力争半小时，省下一百五，气饱了。', weight: 6, rarity: 'common',
        options: [{ label: '自认倒霉（-¥500）', cost: 500 }] },
      { id: 'electricBill', title: '电表转疯了', desc: '工作室二十台设备同时充电，电闸跳了三次。房东笑着递来账单。', weight: 5, rarity: 'uncommon',
        options: [{ label: '交钱（-¥800）', cost: 800 }] },
      { id: 'scareLetter', title: '匿名恐吓信', desc: '门缝里塞着一张纸条，打印体："第 99 号，别抬头看月亮。"没有落款。你把纸条烧了，灰烬里有种不祥的熟悉感。', weight: 2, rarity: 'rare',
        options: [{ label: '烧掉它', cost: 0 }] },
      { id: 'poach', title: '同行挖角', desc: '"兄弟，来我这儿，分成翻倍。"——对面开价了。你的小弟低头搓着手机，欲言又止。', weight: 4, rarity: 'uncommon',
        options: [{ label: '放他走（失去一名小弟）', cost: 0 }, { label: '加钱召回（-¥5000）', cost: 5000 }] },
      { id: 'bigBet', title: '限时押注大单', desc: '"圈内疯传：三天后有一批压票放出，吃下就是十倍利润——但要先押上全部身家的一半。"你盯着屏幕，心跳如鼓。梭哈，还是怂？', weight: 3, rarity: 'rare',
        options: [{ label: '梭哈！押上一半资金！', cost: 0 }, { label: '怂了，落袋为安', cost: 0 }] },

    },
    STORY: {
      P0: { id: 'P0', type: 'dialogue', speaker: '旁白', text: '深夜，地铁末班车。林小韭盯着手机——山城老灶·悬崖火锅的预约界面，第三次抢号失败。屏幕常年碎裂，裂纹里正好卡着倒计时。', next: 'P1' },
      P1: { id: 'P1', type: 'dialogue', speaker: '系统', text: '叮——检测到怨气值爆表。抢购圣手系统，竭诚为您服务。我是您的老父亲。今天～你抢了吗～', next: 'P2' },
      P2: { id: 'P2', type: 'task', speaker: '系统', text: '来，给您上一课：全网就 3 个悬崖火锅号，全靠手速。开始抢购，越接近 0 秒按「抢！」越有戏。', taskId: 'T0-1', onComplete: 'P3' },
      P3: { id: 'P3', type: 'dialogue', speaker: '系统', text: '抢到了！！0.3% 的概率！您就是天选之牛！看看周围，车厢里的人都在看您——狂喜是藏不住的。', next: 'P3b' },
      P3b: { id: 'P3b', type: 'dialogue', speaker: '地铁大妈', text: '旁边的大妈眯眼打量你半天，突然一拍大腿：「小伙子是黄牛吧？！加价卖我呗，我孙子等着看恐龙展！」你没等开口，她又摆摆手：「算了算了，你这手抖得跟帕金森似的，不像专业干这个的。」', next: 'P4' },
      P4: { id: 'P4', type: 'choice', speaker: '倒号老头', text: '火锅店门口，一个老头凑过来：小伙子，号子卖不卖？你这号，抢它图啥？', choices: [
        { id: 'sell', text: '卖给他，赚点外快', next: 'P5', effect: { oldManSale: 1, money: 80 } },
        { id: 'keep', text: '不卖，我要请她吃火锅', next: 'P5', effect: { flag: 'keepTicket' } },
      ] },
      P5: { id: 'P5', type: 'dialogue', speaker: '系统', text: '顺便说一句——升级皮肤「土金弹窗」，原价 998，可分期，纯整活，不扣钱。您听听，这广告都真诚得不像话。', next: 'C1_0' },

      C1_0: { id: 'C1_0', type: 'dialogue', speaker: '旁白', text: '次日，山城老灶·悬崖火锅。门口排到看不见尾，您攥着号，心里美滋滋。小雨——前台客服——对你笑了笑：先生，普通桌，请进。', next: 'C1_1' },
      C1_1: { id: 'C1_1', type: 'task', speaker: '系统', text: '进店前还有个机会——普通桌随便坐，但 VIP 悬崖包间，得抢。先给您演示一下成功率机制：手速等级越高，成功率上限越高。开抢！', taskId: 'T1-1', onComplete: 'C1_2' },
      C1_2: { id: 'C1_2', type: 'dialogue', speaker: '旁白', text: '落座。小雨端来锅底，聊了几句。你憋了半天，说出那句憋了三年的台词：其实……我只是想请你吃顿火锅。', next: 'C1_2b' },
      C1_2b: { id: 'C1_2b', type: 'dialogue', speaker: '小雨', text: '小雨收拾桌面时，目光在你碎屏手机上停了两秒：「哥，屏幕裂成这样还能抢到 VIP 包间……你手速练过？」你正想说没有，她低下头在本子上记了点什么。【叮！检测到关键人物好感度 +1。】', next: 'C1_3' },
      C1_3: { id: 'C1_3', type: 'task', speaker: '系统', text: '好样的，趁热打铁！VIP 悬崖包间，今晚还剩 1 间。抢！抢！抢！老父亲给你打气！', taskId: 'T1-2', onComplete: 'C1_4' },
      C1_4: { id: 'C1_4', type: 'dialogue', speaker: '系统', text: '成了！我跟您说句掏心窝子的话——这票啊，其实早就给您预留好了。抢，不过是个仪式感。', next: 'C1_4b' },
      C1_4b: { id: 'C1_4b', type: 'dialogue', speaker: '系统', text: '屏幕忽然弹出一条灰色通知：【内部日志 · 观察对象 #99 林小韭 · 成长曲线符合预期 · 按 S 计划继续投喂】三秒后，通知自动撤回。「刚才那条是系统升级测试！您什么都没看见！」', next: 'C1_5' },
      C1_5: { id: 'C1_5', type: 'choice', speaker: '倒号老头', text: '出门时老头又堵住您：V 号，VIP 包间，转给我，高价收。第二次了啊，小伙子。', choices: [
        { id: 'sell2', text: '又卖了，香', next: 'C1_6', effect: { oldManSale: 1, money: 300 } },
        { id: 'keep2', text: '不卖，这顿火锅必须请', next: 'C1_6' },
      ] },
      C1_6: { id: 'C1_6', type: 'dialogue', speaker: '系统', text: '第一课结业。恭喜您，正式入门。下一课：全城扫货。记住老父亲说的——稀缺，是可以被制造出来的。', next: 'CX_0' },

      CX_0: { id: 'CX_0', type: 'choice', speaker: '班长', text: '深夜，班长突然来电：「老同学，周六同学会，五星酒店，人均一千五！你……来不来啊？」电话那头传来一阵压低的嗤笑。', choices: [
        { id: 'goReunion', text: '去！谁怕谁（触发支线：同学会风云）', next: 'CX_1' },
        { id: 'skipReunion', text: '不去了，还要扫货（跳过支线）', next: 'C2_0' },
      ] },
      CX_1: { id: 'CX_1', type: 'dialogue', speaker: '富二代·金总', text: '包间里，开保时捷的金总搂着女同学斜眼看你：「哟，小林来了。听说你在送外卖？正好，我那杯奶茶快凉了。」满桌哄笑。你攥紧了手机——屏幕裂纹里，系统的红光一闪一闪。', next: 'CX_2' },
      CX_2: { id: 'CX_2', type: 'choice', speaker: '系统', text: '【叮！检测到宿主尊严受击！】紧急支线任务发布：本城传说中「三个月都订不到」的天空之镜包间，今晚 21:00 放出唯一余位。当场订下它，打所有人的脸！', choices: [
        { id: 'slapFace', text: '接任务！当场订下天空之镜（限时挑战）', next: 'CX_3', effect: { setTask: 'T1-3' } },
        { id: 'endureIt', text: '忍了……低头吃菜（错失支线）', next: 'CX_3a' },
      ] },
      CX_3a: { id: 'CX_3a', type: 'dialogue', speaker: '系统', text: '你低头扒了两口饭就撤了。背后金总的声音追出来：「慢走啊外卖员～记得给我好评哦！」系统幽幽叹气：【宿主，忍一时越想越气，退一步越想越亏。】', next: 'C2_0' },
      CX_3: { id: 'CX_3', type: 'task', speaker: '系统', text: '【限时任务开启】全城仅此一位！手速与尊严的双重考验——抢它！让这张桌子上所有人心服口服！', taskId: 'T1-3', onComplete: 'CX_4' },
      CX_4: { id: 'CX_4', type: 'dialogue', speaker: '旁白', text: '「滴——预订成功。」你把手机往桌上一立：天空之镜包间，今晚 22:00，可俯瞰全城夜景。全场死寂三秒，金总的奶茶掉在了地上。女同学小声惊呼：「他不是外卖员……他是黄牛王啊！」系统：【叮！装逼成功！奖励 ¥2000，获得称号「深藏不露」。】', next: 'C2_0' },

      C2_0: { id: 'C2_0', type: 'dialogue', speaker: '旁白', text: '小雨朋友圈晒出一个隐藏款：限量 99 个的夜光鬼火。你决定，全城扫货给她凑一套。', next: 'C2_1' },
      C2_1: { id: 'C2_1', type: 'dialogue', speaker: '夜排大哥', text: '泡泡玛特门口，夜排大哥拍拍你：兄弟，这排我罩的，管理费 50，扫码。生态，就是这么养起来的。', next: 'C2_2' },
      C2_2: { id: 'C2_2', type: 'task', speaker: '系统', text: '第一店，限定款限量款，来，抢！50% 成功率，比火锅号稳多了。', taskId: 'T2-1', onComplete: 'C2_3' },
      C2_3: { id: 'C2_3', type: 'dialogue', speaker: '系统', text: '欧气大礼包已到账！恭喜解锁「炫彩霓虹」皮肤，全屏霓虹，抢购时更有排面——要不要看看 998 分期套餐？', next: 'C2_3b' },
      C2_3b: { id: 'C2_3b', type: 'dialogue', speaker: '夜排大哥', text: '夜排大哥蹲在马路牙子上给你上课：「兄弟，你知道为啥叫限量吗？厂里一年就产九千九，官方放三千，剩下的去哪了？」他压低声音，眼神发亮，「去了该去的地方。这，就叫生态。」远处，又一个通宵排队的人盖上了毯子。', next: 'C2_4' },
      C2_4: { id: 'C2_4', type: 'task', speaker: '系统', text: '还差 6 家店。连抢 7 家，凑齐隐藏款全家福。扫货开始——每店一个，双击屏幕快点！', taskId: 'T2-2', onComplete: 'C2_5' },
      C2_5: { id: 'C2_5', type: 'dialogue', speaker: '系统', text: '7/7 集齐！挂闲鱼，秒出，银行卡数字开始膨胀。顺便——辞职吧，打工哪有抢购来钱快。', next: 'C2_5b' },
      C2_5b: { id: 'C2_5b', type: 'choice', speaker: '系统', text: '出货讲究定价博弈：行情随供需浮动，临近开场先涨后崩。这批隐藏款，您打算怎么出？', choices: [
        { id: 'sellHigh', text: '高价慢出，蹲大冤家（+¥9000，风控+8）', next: 'C2_5c', effect: { money: 9000, risk: 8 } },
        { id: 'sellWhole', text: '同行批发，走量秒清（+¥6500，风控+3）', next: 'C2_5c', effect: { money: 6500, risk: 3 } },
        { id: 'sellFast', text: '低价快出，落袋为安（+¥5000）', next: 'C2_5c', effect: { money: 5000 } },
      ] },
      C2_5c: { id: 'C2_5c', type: 'dialogue', speaker: '系统', text: '单打独斗到头了。老父亲给您置办个工作室：夜排型扛体力、技术型防风控、嘴皮型抬价格、眼线型搞情报。招三个小弟，开张！', next: 'C2_5d' },
      C2_5d: { id: 'C2_5d', type: 'task', speaker: '系统', text: '工作室开张——从人才市场挑 3 个小弟吧。记住老父亲的话：兄弟多了，路才野。', taskId: 'T2-3', onComplete: 'C2_6' },
      C2_6: { id: 'C2_6', type: 'dialogue', speaker: '老板', text: '老板看着你的辞职信：「去送外卖？你啊，就适合踏踏实实送外卖。」你头也不回。', next: 'C2_6c' },
      C2_6c: { id: 'C2_6c', type: 'dialogue', speaker: '前同事群', text: '前同事群炸了锅：「听说小林裸辞了？」「去送外卖了吧哈哈哈」「刚刷到他朋友圈跟个大老板勾肩搭背……P的吧？」你看了三秒，默默退群。【叮！无效社交已清理，专注度 +10%。】', next: 'C2_7' },
      C2_7: { id: 'C2_7', type: 'choice', speaker: '倒号老头', text: '老地方，老头第三次蹲你：隐藏款，收。小伙子，这已经是第三次了啊。', choices: [

      CB_0: { id: 'CB_0', type: 'choice', speaker: '主播美琪', text: '私信爆了。百万粉的主播美琪发来连麦邀请：「韭神大大！今晚直播挑战：30 秒清空一场话剧的 50 张连座！敢不敢？10 万人在线等着看！」', choices: [

      C3_3b: { id: 'C3_3b', type: 'dialogue', speaker: '系统', text: '【全服圣手周榜更新】第一名：▓▓▓（等级隐藏）；第二名：九头鸟·九哥；……第九十九名：林小韭。你盯着自己的名次愣了一下——为什么偏偏是 99？系统秒回：「巧合！纯属巧合！」', next: 'C3_4' },

      C4_3: { id: 'C4_3', type: 'dialogue', speaker: '小雨', text: '典礼上，颁奖人摘下口罩——是小雨。她看着你，缓缓开口：林小韭，第 99 号祭品，欢迎来到万物之巅。', next: 'C4_3b' },
      C4_3b: { id: 'C4_3b', type: 'dialogue', speaker: '余安', text: '她挥手调出一面巨大的名单墙。99 个名字从上到下排列，每个名字后面都标着一个日期。「这是历届圣手的『入职日』和『毕业日』。」她的指尖停在最底下的空位，「你的名字已经刻好了。日期，就看今晚。」', next: 'C4_4' },
      C4_4: { id: 'C4_4', type: 'dialogue', speaker: '余安', text: '我本名余安，余年偷安。我哥是职业黄牛，被管理局养蛊，在巅峰那天被直播献祭，然后跳了楼。我做了三年证据，就等一个还有良心的祭品。你，是第 99 个。', next: 'C4_4b' },
      C4_4b: { id: 'C4_4b', type: 'choice', speaker: '余安', text: '她从风衣内袋里掏出一本泛黄的笔记本，封皮上写着两个字：余航。「我哥的日记。三年了，我一直带着它。」她递到你面前，「要看吗？」', choices: [

      C4_4c: { id: 'C4_4c', type: 'dialogue', speaker: '余航的日记', text: '最后一页的字迹潦草得厉害：「如果有人看到这本日记，说明我也上了那个名单。别信系统。别信排行榜。它给你的每一分运气，都在暗中标好了价格。——余航 绝笔」你合上日记，指节发白。余安看着你：「现在，你知道我为什么等你了。」', next: 'C4_5a' },
      C4_5a: { id: 'C4_5a', type: 'dialogue', speaker: '系统', text: '系统的声音第一次带上了电流杂音：【最终警告：若选择公开真相，宿主的欧气值、手速等级、全部皮肤将被清零，且永不再分配。】沉默两秒，老父亲又用平时那种欠揍的语气补了一句：「不过嘛……清零了，就能像普通人一样排队吃火锅了。排队……也挺好的。」', next: 'C4_5' },
      C4_5: { id: 'C4_5', type: 'choice', speaker: '系统', text: '抢购圣手系统，第 1 至 99 号人手一套，第 99 号之后随管理局退休。老父亲最后问你一句：孩子，这最后一手，你打算怎么抢？', choices: [
        { id: 'A', text: '入局掌刀，接替小雨', next: 'END_A', effect: { ending: 'A' } },

      END_HIDDEN: { id: 'END_HIDDEN', type: 'ending', ending: 'hidden', speaker: '系统', text: '全程零溢价交易。您这一生，一张都没多赚过。老父亲，为您骄傲。' },

  else global.GameData = GameData;

</script>
  <script>
(function (global) {
  const D = (typeof require !== 'undefined') ? require('./data.js') : global.GameData;
  const LEVELS = D.LEVELS;

  let _rng = Math.random;
  let _storage = null;

  function getStorage() {
    if (_storage) return _storage;
    if (typeof global.localStorage !== 'undefined') return global.localStorage;
    const mem = {};
    return {
      getItem: k => (k in mem) ? mem[k] : null,
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; },
    };
  }

  const GameEngine = {
    setRng: fn => { _rng = fn; },
    setStorage: s => { _storage = s; },

    createRun() {
      return {
        version: 1, chapter: 'prologue', nodeId: 'P0',
        luck: 0, level: 0, money: 0,
        currentTask: 'T0-1', taskProgress: 0,
        tasksCompleted: [], failStreak: 0, oldManSales: 0, reverseSales: 0,
        risk: 0, streak: 0, staff: { night: 0, tech: 0, talk: 0, intel: 0 },
        school: null, inventory: [], marketIdx: 100, conscience: 0, boughtBuff: 0,
        endless: false, score: 0, fails: 0,
        day: 1, marketPhase: 'flat', marketLeft: 2, today: 'normal',
        ledger: [], auctionCount: 0, warehouseDown: 0,
        pendingEventId: null, chainPending: null, pendingGoodNext: false,
        giftsOwned: [], giftShop: null, collection: {}, equipmentId: 'e0',
        prediction: null,
        difficulty: 'normal', fatigueTask: '', fatigueN: 0, tilted: false,
        reportFlag: false, rivalWins: 0, betPending: null,
        skins: [], flags: {}, ended: null,
      };
    },

    diffMul(run) {
      return run.difficulty === 'casual' ? 0.5 : run.difficulty === 'hell' ? 2 : 1;
    },

    fakeTapPenalty(run) {
      const t = D.TASKS[run.currentTask];
      if (!t) return 0;
      const before = run.taskProgress || 0;
      run.taskProgress = Math.max(0, before - 1);
      return before - run.taskProgress;
    },

    calmDown(run) {
      if ((run.money || 0) < 800) return false;
      run.money -= 800;
      run.tilted = false;
      run.failStreak = 0;
      this.logTransaction(run, '冰美式冷静费', -800);
      return true;
    },

    clearReportFlag(run) { run.reportFlag = false; },

    rivalFine(run) {
      const fine = Math.round(1000 * this.diffMul(run));
      run.money = Math.max(0, (run.money || 0) - fine);
      this.logTransaction(run, '被截胡罚款', -fine);
      return fine;
    },

    rivalWin(run) {
      run.rivalWins = (run.rivalWins || 0) + 1;
      return run.rivalWins;
    },

    logTransaction(run, desc, amount) {
      if (!Array.isArray(run.ledger)) run.ledger = [];
      run.ledger.unshift({ day: run.day || 1, desc, amount });
      if (run.ledger.length > 30) run.ledger.length = 30;
    },

    giftShopReroll(run) {
      const pool = [];
      for (const g of D.GIFTS) {
        if ((run.giftsOwned || []).includes(g.id)) continue;
        pool.push(g);
      }
      const order = pool.map((_, i) => i);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.min(i, Math.floor(_rng() * (i + 1)));
        [order[i], order[j]] = [order[j], order[i]];
      }
      const n = Math.min(pool.length, 2 + Math.floor(_rng() * 2));
      const shop = order.slice(0, n).map(i => {
        const g = pool[i];
        const limited = _rng() < 0.10;
        const jitter = 0.8 + _rng() * 0.4;
        return { id: g.id, price: Math.round(g.price * jitter), limited };
      });
      run.giftShop = shop;
    },

    buyGift(run, giftId) {
      const entry = (run.giftShop || []).find(s => s.id === giftId);
      const g = D.GIFTS.find(x => x.id === giftId);
      if (!entry || !g) return { ok: false };
      if ((run.money || 0) < entry.price) return { ok: false, poor: true };
      run.money -= entry.price;
      this.logTransaction(run, '心愿礼物 · ' + g.name + (entry.limited ? '(限定款!)' : ''), -entry.price);
      if (!run.giftsOwned.includes(giftId)) run.giftsOwned.push(giftId);
      run.giftShop = (run.giftShop || []).filter(s => s.id !== giftId);
      const all = D.GIFTS.every(x => run.giftsOwned.includes(x.id));
      return { ok: true, limited: entry.limited, story: g.story, allOwned: all, name: g.name };
    },

    buyEquipment(nextId) {
      return D.EQUIPMENT.find(e => e.id === nextId);
    },

    capacity(run) {
      let cap = 4;
      if (run.flags && run.flags.studio) cap += 2;
      if (run.chapter === 'ch4') cap += 2;
      cap -= Math.max(0, run.warehouseDown || 0);
      return Math.max(2, cap);
    },

    canStartPurchase(run, taskId) {
      const t = D.TASKS[taskId];
      if (!t) return { ok: true };
      if (t.loot && !run.endless && (run.inventory.length >= this.capacity(run))) {
        return { ok: false, reason: '仓库已满！先去行情页出货。' };
      }
      return { ok: true };
    },

    netDelayRoll(run) {
      const eq = this.equipmentOf(run);
      const base = 60 + Math.floor(Math.random() * 201);
      return Math.max(30, base - (eq ? eq.delayRed : 0));
    },

    equipmentOf(run) {
      return D.EQUIPMENT.find(e => e.id === (run.equipmentId || 'e0')) || D.EQUIPMENT[0];
    },

    timingTotal(run, taskId) {
      let total = run.school === 'hand' ? 1800 : 1200;
      const eq = this.equipmentOf(run);
      total += eq.totalAdd || 0;
      if (taskId === 'T4-1') total = Math.round(total * 0.9);
      return total;
    },
    perfectThreshold(run) {
      const eq = this.equipmentOf(run);
      const base = run.school === 'hand' ? 450 : 350;
      return base + (eq.perfectAdd || 0);
    },

    staffCount(run, type) {
      return (run.staff && run.staff[type]) || 0;
    },

    addRisk(run, amount) {
      const tech = this.staffCount(run, 'tech');
      const relief = (run.school === 'people' ? 1 : 0);
      const gain = Math.max(1, amount - tech - relief);
      run.risk = Math.min(100, Math.max(0, (run.risk || 0) + gain));
      return gain;
    },

    getLevel(luck) {
      let lvl = 0;
      for (let i = 0; i < LEVELS.length; i++) {
        if (luck >= LEVELS[i].luckReq) lvl = i;
      }
      return lvl;
    },

    getTaskRate(run, taskId) {
      const t = D.TASKS[taskId];
      if (!t) return 0;
      const cap = LEVELS[Math.min(run.level, LEVELS.length - 1)].cap;
      return Math.min(t.baseRate, cap);
    },

    addLuck(run, amount) {
      run.luck += amount;
      const newLevel = this.getLevel(run.luck);
      const leveledUp = newLevel > run.level;
      run.level = newLevel;
      return { leveledUp, newLevel };
    },

    saveRun(run) { getStorage().setItem('hn_run', JSON.stringify(run)); },
    loadRun() {
      const raw = getStorage().getItem('hn_run');
      if (!raw) return null;
      try { return this.migrateRun(JSON.parse(raw)); } catch (e) { return null; }
    },
    migrateRun(run) {
      if (!run || typeof run !== 'object') return run;
      const fresh = this.createRun();
      for (const k of Object.keys(fresh)) {
        if (run[k] === undefined) run[k] = fresh[k];
      }
      if (!run.staff || typeof run.staff !== 'object') run.staff = { night: 0, tech: 0, talk: 0, intel: 0 };
      if (!Array.isArray(run.inventory)) run.inventory = [];
      return run;
    },
    saveGlobal(g) { getStorage().setItem('hn_global', JSON.stringify(g)); },
    loadGlobal() {
      const raw = getStorage().getItem('hn_global');
      if (!raw) return null;
      try { return JSON.parse(raw); } catch (e) { return null; }
    },
    newRun(g, school, difficulty) {
      g.runCount = (g.runCount || 0) + 1;
      g.reverseUnlocked = g.runCount >= 2;
      this.saveGlobal(g);
      const run = this.createRun();
      run.school = school || null;
      if (school === 'capital') run.money = 5000;
      run.difficulty = difficulty || 'normal';
      run.flags.reverseUnlocked = g.reverseUnlocked;
      return run;
    },

    advanceMarket(run) {
      const delta = Math.floor(_rng() * 21) - 8;
      run.marketIdx = Math.min(130, Math.max(90, (run.marketIdx || 100) + delta));
      for (const it of (run.inventory || [])) it.held += 1;
      return run.marketIdx;
    },

    itemValue(run, item) {
      const eq = this.equipmentOf(run);
      let v = item.base * (run.marketIdx / 100) * Math.pow(0.92, item.held || 0);
      if (item.quality === 'good') v *= 1.2;
      if (item.quality === 'best') v *= 1.5;
      if (item.damp) v *= 0.6;
      if (item.rare) v *= 1.5;
      if (item.fake) v = 0;
      if (run.today === 'concert') v *= 1.2;
      return Math.round(v);
    },

    sellItem(run, index, channel) {
      const item = run.inventory[index];
      if (!item) return { ok: false, gain: 0 };
      const value = this.itemValue(run, item);
      const r = _rng();
      let mult = 1;
      let outcome = '';
      if (channel === 'retail') {
        if (r < 0.7) { mult = 1.35; outcome = '零售高价出手！'; }
        else { mult = 0.95; outcome = '被砍了点价……'; }
      } else if (channel === 'wholesale') {
        mult = run.school === 'people' ? 0.9 : 0.85; outcome = '同行秒收，走量落袋。';
      } else if (channel === 'vip') {
        if (r < 0.85) { mult = 1.6; outcome = '大客户包圆，赚翻了！'; }
        else { mult = 0; outcome = '遇到骗子，血本无归！'; }
      } else if (channel === 'auction') {
        mult = (run.school === 'people' ? 0.9 : 0.85) * 2; // placeholder, real path via sellAuction
      }
      const gain = Math.round(value * mult);
      run.money = (run.money || 0) + gain;
      run.inventory.splice(index, 1);
      if (gain > 0) this.logTransaction(run, '卖出 · ' + item.name + (item.quality && item.quality !== 'normal' ? `(${item.quality === 'best' ? '极品' : '优质'})` : ''), gain);
      return { ok: true, gain, outcome, value };
    },

    sellAuction(run, index) {
      const item = run.inventory[index];
      if (!item || item.fake) return { ok: false };
      if ((run.marketIdx || 100) < 115) return { ok: false };
      run.auctionCount = (run.auctionCount || 0) + 1;
      const phishProb = Math.min(0.35, 0.20 + 0.05 * ((run.auctionCount - 1) % 4));
      const value = this.itemValue(run, item);
      if (_rng() < phishProb) {
        run.inventory.splice(index, 1);
        this.addRisk(run, 15);
        this.logTransaction(run, '黑市钓鱼执法 · 血本无归', 0);
        return { ok: true, phished: true, loss: value, riskUp: 15 };
      }
      const mult = 1.6 + _rng() * 0.4;
      const gain = Math.round(value * mult);
      run.money += gain;
      this.addRisk(run, 12);
      run.inventory.splice(index, 1);
      this.logTransaction(run, '黑市拍卖 · ' + item.name, gain);
      return { ok: true, phished: false, gain, riskUp: 12 };
    },

    hypeItem(run, index) {
      const item = run.inventory[index];
      if (!item || item.held < 3) return { ok: false };
      item.base = Math.round(item.base * 1.15);
      item.hypeCount = (item.hypeCount || 0) + 1;
      this.addRisk(run, 6);
      if (item.hypeCount >= 3 && _rng() < 0.3) {
        item.base = Math.round(item.base * 0.5);
        item.hypeCount = 0;
        return { ok: true, exposed: true };
      }
      return { ok: true, exposed: false, base: item.base };
    },

    rollProfitOrder(run) {
      if ((run.marketIdx || 100) < 120) return null;
      if (!run.inventory.length) return null;
      if (_rng() >= 0.25) return null;
      const idx = Math.floor(_rng() * run.inventory.length);
      const fake = _rng() < 0.2;
      return { idx, mul: 1.5 + _rng() * 0.25, fake, deposit: 1500 };
    },

    acceptProfitOrder(run, order) {
      const item = run.inventory[order.idx];
      if (!item) return { ok: false };
      if (order.fake) {
        run.money = Math.max(0, (run.money || 0) - order.deposit);
        this.logTransaction(run, '暴利订单被骗 · 保证金', -order.deposit);
        return { ok: true, faked: true, loss: order.deposit };
      }
      const gain = Math.round(this.itemValue(run, item) * order.mul);
      run.money += gain;
      run.inventory.splice(order.idx, 1);
      this.logTransaction(run, '神秘买家订单 · ' + item.name, gain);
      return { ok: true, faked: false, gain };
    },

    rollPurchase(run, taskId, timingScore) {
      const t = D.TASKS[taskId];
      if (!t) return { success: false, luckGain: 0, leveledUp: false, newLevel: run.level };
      // 黄金窗口收窄：ch3/ch4 时序任务，得分 <0.45 视为陪跑
      if ((run.chapter === 'ch3' || run.chapter === 'ch4') && t.mode === 'timing' && timingScore > 0 && timingScore < 0.45) {
        timingScore = 0;
      }
      // 心态爆炸：连败 ≥5 后下一次得分减半（一次性）
      let tiltedJustSet = false;
      if (run.tilted && t.mode === 'timing') { timingScore *= 0.5; run.tilted = false; }
      const rate = this.getTaskRate(run, taskId);
      const nightBonus = this.staffCount(run, 'night') * 0.03;
      let effectiveRate = Math.min(1, rate + timingScore * 0.4 + (run.refreshBuff || 0) + nightBonus + (run.boughtBuff || 0));
      if (t.loot && t.loot.base >= 8000) effectiveRate -= 0.10;
      // 市场疲劳：同一任务反复尝试，成功率递减
      if (run.fatigueTask !== taskId) { run.fatigueTask = taskId; run.fatigueN = 0; }
      const fatPenalty = Math.min(0.4, (run.fatigueN || 0) * 0.08 * this.diffMul(run));
      effectiveRate -= fatPenalty;
      effectiveRate = Math.max(0, effectiveRate);
      const success = _rng() < effectiveRate;
      const oldLevel = run.level;
      const baseGain = success ? 50 : 20;
      const consolation = success ? 0 : (run.failStreak + 1) * 5;
      if (success) {
        run.failStreak = 0;
        run.streak = (run.streak || 0) + 1;
        run.fatigueN = 0;
        run.tilted = false;
      } else {
        run.failStreak += 1;
        run.streak = 0;
        run.fatigueN = (run.fatigueN || 0) + 1;
        if (t.mode === 'timing' && run.failStreak >= 5 && !run.tilted) {
          run.tilted = true;
          tiltedJustSet = true;
        }
      }
      const streakMul = run.school === 'hand' ? 2 : 1;
      const streakBonus = success ? Math.min(run.streak, 5) * 10 * streakMul : 0;
      const luckGain = baseGain + consolation + streakBonus;
      this.addRisk(run, success ? 4 : 2);
      let ap = { taskCompleted: false, rewards: {}, rent: 0, banEvent: null };
      if (success) {
        this.addLuck(run, luckGain);
        ap = this.advanceProgress(run, taskId, 1);
      } else {
        this.addLuck(run, luckGain);
      }
      return { success, luckGain, streakBonus, leveledUp: run.level > oldLevel, newLevel: run.level, rent: ap.rent || 0, banEvent: ap.banEvent || null, fatPenalty, tiltedJustSet, tiltedActive: !success && (run.failStreak||0) >= 5 };
    },

    advanceProgress(run, taskId, n) {
      const t = D.TASKS[taskId];
      if (!t) return { taskCompleted: false, rewards: {} };
      if (taskId === run.currentTask) {
        run.taskProgress += n;
        if (t.mode === 'rapid') this.addRisk(run, 2);
      }
      if (run.taskProgress < t.progressTarget) return { taskCompleted: false, rewards: {} };
      return this.completeTask(run, taskId);
    },

    resolveRiskCheck(run) {
      const risk = run.risk || 0;
      if (risk < 60) return { safe: true, loss: 0, risk };
      const loss = Math.min(run.money || 0, 5000 + risk * 100);
      run.money = (run.money || 0) - loss;
      run.risk = Math.max(0, risk - 30);
      return { safe: false, loss, risk };
    },

    rollDailyEventId(run) {
      if (run.chainPending === 'betrayal') {
        run.chainPending = null;
        return '__betrayal__';
      }
      if (run.pendingGoodNext) {
        run.pendingGoodNext = false;
        return '__coupon__';
      }
      const prob = (run.today === 'crackdown' ? 0.35 : 0.18) * this.diffMul(run);
      if (_rng() >= prob) return null;
      let pool = D.EVENTS.filter(e => !(e.id === 'waterDamage' && run.school === 'people'));
      const hasStaff = ['night', 'tech', 'talk', 'intel'].some(k => this.staffCount(run, k) > 0);
      pool = pool.filter(e => e.id !== 'poach' || hasStaff);
      pool = pool.filter(e => e.id !== 'bigBet' || (run.money || 0) >= 100);
      const totalW = pool.reduce((s, e) => s + e.weight, 0);
      let r = _rng() * totalW;
      for (const e of pool) {
        r -= e.weight;
        if (r <= 0) return e.id;
      }
      return pool[0].id;
    },

    applyEventOption(run, eventId, optIdx) {
      const ev = D.EVENTS.find(e => e.id === eventId);
      let resultText = '';
      if (eventId === '__betrayal__') {
        if (run.inventory.length) {
          const idx = Math.floor(_rng() * run.inventory.length);
          const it = run.inventory.splice(idx, 1)[0];
          resultText = `阿强连夜跑路，顺走了你的「${it.name}」。人心散了，队伍不好带。`;
          this.logTransaction(run, '小弟叛逃 · 损失' + it.name, 0);
        } else {
          resultText = '阿强跑路了。还好仓库是空的，没东西可偷——这算是穷的幸运吗？';
        }
        return { done: true, text: resultText };
      }
      if (eventId === '__coupon__') {
        run.money += 500;
        this.logTransaction(run, '平台补偿优惠券', 500);
        return { done: true, text: '平台客服主动送来 ¥500 补偿券："给您添堵了，对不起。"祸福相依，古人诚不欺我。' };
      }
      if (!ev || !ev.options[optIdx]) return { done: true, text: '' };
      const opt = ev.options[optIdx];
      switch (ev.id) {
        case 'waterDamage':
          run.money = Math.max(0, (run.money || 0) - opt.cost);
          this.logTransaction(run, '手机维修', -opt.cost);
          resultText = `花 ¥${opt.cost} 修好了机器。师傅说："你这损耗率，建议买我们的年卡。"`;
          break;
        case 'broArrested':
          if (run.school === 'people') {
            resultText = '你一个电话打给老江湖，十分钟后阿强完好无损回来了。"哥，你在道上到底啥地位？"';
          } else {
            run.money = Math.max(0, (run.money || 0) - opt.cost);
            this.logTransaction(run, '捞人费用', -opt.cost);
            if (_rng() < 0.10) run.chainPending = 'betrayal';
            resultText = '人捞出来了，但看他的眼神，总觉得有什么东西不一样了……';
          }
          break;
        case 'reported':
          run.money = Math.max(0, (run.money || 0) - opt.cost);
          this.addRisk(run, 5);
          this.logTransaction(run, '平台罚款', -opt.cost);
          resultText = '罚款交了，风控涨了。九头鸟残部在群里发了个月亮的表情。';
          if (_rng() < 0.25) { run.pendingGoodNext = true; }
          break;
        case 'dampStock': {
          const cands = (run.inventory || []).filter(i => !i.damp && !i.fake);
          if (cands.length) {
            const it = cands[Math.floor(_rng() * cands.length)];
            it.damp = true;
            if (_rng() < 0.25) { run.pendingGoodNext = true; run._dampRareCandidate = it.name; }
            resultText = `「${it.name}」受了潮，卖相差了。不过老收货的说过：受潮的限量款，有时候叫孤品。`;
          } else {
            resultText = '还好仓库空空如也，水淹不到空气。';
          }
          break;
        }
        case 'auditFreeze': {
          const loss = Math.ceil((run.money || 0) * 0.05);
          run.money -= loss;
          this.logTransaction(run, '平台冻结放血', -loss);
          resultText = `冻结了 ¥${loss}。七天后解冻，但利息？不存在的。`;
          break;
        }
        case 'relativeBorrow':
          run.conscience = (run.conscience || 0) + (opt.conscience || 0);
          if (opt.cost > 0) {
            run.money = Math.max(0, (run.money || 0) - opt.cost);
            this.logTransaction(run, '表叔借款', -opt.cost);
            resultText = '钱转过去了。表叔发来一个"抱拳"表情，和一段60秒语音。你没敢听。';
          } else {
            resultText = '"叔，我最近也难。"你说完就把他删了。成年人的绝交，安静得像退群。';
          }
          break;
        case 'fanCrowdfund':
          if (opt.gain > 0) {
            run.money += opt.gain;
            this.addRisk(run, opt.risk);
            this.logTransaction(run, '粉丝众筹应援', opt.gain);
            resultText = '锦旗挂在工作室最显眼的地方。每次想摆烂，看一眼就又能干了。';
          } else {
            resultText = '你婉拒了粉丝们的好意。站长说你是"清流"，转头把集资买了周边。';
          }
          break;
        case 'fakeSwap': {
          const cands = (run.inventory || []).filter(i => !i.fake);
          if (opt.cost > 0 && cands.length) {
            run.money = Math.max(0, (run.money || 0) - opt.cost);
            this.logTransaction(run, '老师傅鉴定费', -opt.cost);
            const it = cands[Math.floor(_rng() * cands.length)];
            it.fake = false;
            resultText = `老师傅眯眼摸了三分钟，指着「${it.name}」："这件，高仿。"当场退货，躲过一劫。`;
          } else if (cands.length) {
            const it = cands[Math.floor(_rng() * cands.length)];
            it.fake = true;
            resultText = `你赌了一把。后来才知道，「${it.name}」就是那件高仿——现在它安安静静躺在仓库里，等着坑下一个买家。`;
          } else {
            resultText = '假货混进来了，可你仓库是空的。骗子白忙一场，气得骂了句方言。';
          }
          break;
        }
        case 'poach': {
          const types = ['night', 'tech', 'talk', 'intel'].filter(k => this.staffCount(run, k) > 0);
          if (opt.cost > 0) {
            run.money = Math.max(0, (run.money || 0) - opt.cost);
            this.logTransaction(run, '小弟召回费', -opt.cost);
            resultText = '你拍出五张红票："谁敢挖我的兄弟！"小弟当场泪目，转头把对面群退了。';
          } else if (types.length) {
            const t = types[Math.floor(_rng() * types.length)];
            run.staff[t] -= 1;
            resultText = '他走的那天没回头。工位上还剩半杯没喝完的奶茶。';
          } else {
            resultText = '对面挖了半天，发现你光杆司令一个，悻悻而去。';
          }
          break;
        }
        case 'bigBet':
          if (opt.label.includes('梭哈')) {
            const stake = Math.max(1, Math.floor((run.money || 0) / 2));
            run.money -= stake;
            run.betPending = { stake, dueDay: (run.day || 1) + 3 };
            this.logTransaction(run, '押注大单 · 押入', -stake);
            resultText = `¥${stake} 已押上。这三天你睡觉都攥着手机，梦里全是进度条。`;
          } else {
            resultText = '你怂了。三天后那批票到底十倍还是血本无归？没人知道。你只知道自己睡了个好觉。';
          }
          break;
        default:
          if (opt.cost > 0) {
            run.money = Math.max(0, (run.money || 0) - opt.cost);
            this.logTransaction(run, ev.title, -opt.cost);
          }
          if (opt.risk) this.addRisk(run, opt.risk);
          resultText = ev.title + '。日子还得过。';
          if ((opt.cost || 0) > 0 && _rng() < 0.25) run.pendingGoodNext = true;
      }
      if (ev.id === 'scareLetter') run.flags.scareLetter = true;
      return { done: true, text: resultText };
    },

    advanceDay(run) {
      run.day = (run.day || 1) + 1;
      const sr = _rng();
      if (sr < 0.12) run.today = 'concert';
      else if (sr < 0.22) run.today = 'crackdown';
      else if (sr < 0.30) run.today = 'promo';
      else run.today = 'normal';
      // 行情相位机
      if ((run.marketLeft || 0) <= 1 || _rng() < 0.05) {
        if (_rng() < 0.05 && (run.marketPhase === 'up' || run.marketPhase === 'down')) {
          if (run.marketPhase === 'up') { run.marketIdx = Math.max(90, (run.marketIdx || 100) - 25); run.marketPhase = 'down'; }
          else { run.marketIdx = Math.min(130, (run.marketIdx || 100) + 22); run.marketPhase = 'up'; }
          run.marketLeft = 3;
        } else {
          const phases = ['up', 'down', 'flat'];
          run.marketPhase = phases[Math.floor(_rng() * 3)];
          run.marketLeft = 3 + Math.floor(_rng() * 3);
        }
      } else {
        run.marketLeft -= 1;
      }
      const jitter = 0.7 + _rng() * 0.6;
      let delta = 0;
      if (run.marketPhase === 'up') delta = Math.round((8 + _rng() * 8) * jitter);
      else if (run.marketPhase === 'down') delta = -Math.round((6 + _rng() * 7) * jitter);
      else delta = Math.round((_rng() - 0.5) * 14);
      run.marketIdx = Math.min(130, Math.max(90, (run.marketIdx || 100) + delta));
      for (const it of (run.inventory || [])) it.held += 1;
      // 炒价曝光骰
      for (const it of (run.inventory || [])) {
        if ((it.hypeCount || 0) >= 2 && _rng() < 0.12) {
          it.base = Math.round(it.base * 0.5);
          it.hypeCount = 0;
        }
      }
      // 受潮孤品转化
      if (run._dampRareCandidate) {
        const it = (run.inventory || []).find(i => i.name === run._dampRareCandidate && i.damp);
        if (it) { delete it.damp; it.rare = true; }
        run._dampRareCandidate = null;
      }
      if (run.warehouseDown > 0) run.warehouseDown -= 1;
      // 固定支出
      const costs = [];
      // 高利贷利息：资金为负时按日滚息
      if ((run.money || 0) < 0) {
        const interest = Math.ceil(Math.abs(run.money) * 0.1);
        run.money -= interest;
        this.logTransaction(run, '高利贷利息', -interest);
        costs.push(`高利贷利息 ¥${interest}`);
      }
      if (run.day > 1 && (run.day - 1) % 7 === 0) {
        let invV = 0;
        for (const it of (run.inventory || [])) invV += this.itemValue(run, it);
        let rent = Math.max(2000, Math.round(((run.money || 0) + invV) * 0.02));
        rent = Math.min(8000, Math.round(rent * this.diffMul(run)));
        if (run.school === 'capital') rent = Math.round(rent / 2);
        run.money = Math.max(0, (run.money || 0) - rent);
        this.logTransaction(run, '每周房租(累进)', -rent);
        costs.push(`房租 ¥${rent}`);
      }
      if (run.day > 1 && (run.day - 1) % 3 === 0) {
        const fee = Math.round(300 * this.diffMul(run));
        run.money = Math.max(0, (run.money || 0) - fee);
        this.logTransaction(run, '水电杂费', -fee);
        costs.push(`杂费 ¥${fee}`);
      }
      // 押注大单结算
      if (run.betPending && run.day >= run.betPending.dueDay) {
        const stake = run.betPending.stake;
        if (_rng() < 0.6) {
          run.money += stake * 2;
          this.logTransaction(run, '押注大单 · 命中', stake * 2);
          costs.push(`大单兑现 +¥${stake * 2}`);
        } else {
          this.logTransaction(run, '押注大单 · 血本无归', 0);
          costs.push('大单翻车，本金蒸发');
        }
        run.betPending = null;
      }
      this.giftShopReroll(run);
      run.order = null;
      const eid = this.rollDailyEventId(run);
      run.pendingEventId = eid || null;
      return { day: run.day, today: run.today, delta, marketIdx: run.marketIdx, costs, eventId: run.pendingEventId };
    },

    completeTask(run, taskId) {
      const t = D.TASKS[taskId];
      const rw = t.rewards || {};
      if (rw.luck) this.addLuck(run, rw.luck);
      if (rw.money) {
        const talkMul = 1 + 0.2 * this.staffCount(run, 'talk');
        run.money += Math.round(rw.money * talkMul);
      }
      if (rw.level && rw.level > run.level) {
        run.level = rw.level;
        const need = LEVELS[rw.level].luckReq;
        if (run.luck < need) run.luck = need;
      }
      if (rw.unlock && typeof rw.unlock === 'string' && rw.unlock.startsWith('flag:')) {
        run.flags[rw.unlock.slice(5)] = true;
      }
      if (rw.conscience) run.conscience = (run.conscience || 0) + rw.conscience;
      const firstTime = !run.tasksCompleted.includes(taskId);
      if (firstTime) run.tasksCompleted.push(taskId);
      if (t.loot && !run.endless && firstTime) {
        const qr = _rng();
        const quality = qr < 0.08 ? 'best' : qr < 0.30 ? 'good' : 'normal';
        const item = { name: t.loot.name, base: t.loot.base, held: 0, quality };
        if (run.inventory.length < this.capacity(run)) {
          run.inventory.push(item);
        }
        const col = run.collection || (run.collection = {});
        if (!col[t.loot.name]) col[t.loot.name] = { count: 0, best: quality };
        col[t.loot.name].count += 1;
        const rank = { normal: 0, good: 1, best: 2 };
        if (rank[quality] > rank[col[t.loot.name].best]) col[t.loot.name].best = quality;
      }
      run.refreshBuff = 0;
      run.refreshUses = 0;
      run.boughtBuff = 0;
      this.advanceDay(run);
      let rent = 0;
      let banEvent = null;
      if (t.nextTask) {
        run.currentTask = t.nextTask;
        run.taskProgress = 0;
        const next = D.TASKS[t.nextTask];
        if (next && next.chapter !== run.chapter) {
          run.chapter = next.chapter;
        }
      }
      const banChance = run.school === 'people' ? 0.2 : 0.4;
      if ((run.risk || 0) >= 60 && _rng() < banChance) {
        const loss = Math.ceil((run.money || 0) * 0.2);
        if (loss > 0) {
          run.money -= loss;
          this.logTransaction(run, '封号危机 · 库存折损', -loss);
          banEvent = { loss };
        }
      }
      // 举报连锁：风控 ≥70 时任务完成后概率被恶意举报
      let reported = false;
      if ((run.risk || 0) >= 70 && _rng() < 0.3 * this.diffMul(run)) {
        const fine = 1000;
        run.money = Math.max(0, (run.money || 0) - fine);
        this.addRisk(run, 3);
        this.logTransaction(run, '被举报罚款', -fine);
        run.reportFlag = true;
        reported = true;
      }
      return { taskCompleted: true, rewards: rw, rent, banEvent, reported };
    },

    applyChoice(run, choiceId) {
      const node = D.STORY[run.nodeId];
      const choice = node.choices.find(c => c.id === choiceId);
      if (!choice) return { nextNode: run.nodeId };
      const eff = choice.effect || {};
      if (eff.money) run.money += eff.money;
      if (eff.risk) this.addRisk(run, eff.risk);
      if (eff.setTask && D.TASKS[eff.setTask]) {
        run.currentTask = eff.setTask;
        run.taskProgress = 0;
      }
      if (eff.oldManSale) {
        run.oldManSales += eff.oldManSale;
        this.checkAchievements(run, 'oldManSale', {});
      }
      if (eff.flag) run.flags[eff.flag] = true;
      if (eff.ending === 'A') run.flags.endingA = true;
      if (eff.ending === 'B') run.flags.endingB = true;
      run.nodeId = choice.next;
      return { nextNode: run.nodeId };
    },

    nodeAfter(run, nodeId) {
      const n = D.STORY[nodeId];
      if (!n) return nodeId;
      if (n.type === 'task' && run.tasksCompleted.includes(n.taskId)) return n.onComplete || nodeId;
      if (n.next) return n.next;
      return nodeId;
    },

    checkEnding(run) {
      if (run.failStreak >= 20 && run.chapter === 'prologue') return 'speedy';
      if (run.flags.endingB && run.reverseSales >= 10 && run.flags.reverseUnlocked) return 'hidden';
      const node = D.STORY[run.nodeId];
      if (node && node.type === 'ending') return node.ending;
      if (run.flags.endingB) return 'B';
      if (run.flags.endingA) return 'A';
      return null;
    },

    checkAchievements(run, eventName, ctx) {
      const unlocked = [];
      if (eventName === 'oldManSale' && run.oldManSales >= 3) unlocked.push('what_for');
      if (eventName === 'purchase' && ctx.perfect) unlocked.push('hand_speed');
      return unlocked;
    },

    endingEffects(run, endingId, g) {
      if (!g.endingsSeen.includes(endingId)) g.endingsSeen.push(endingId);
      if (endingId === 'B') {
        if (!g.skinsOwned.includes('hidden')) g.skinsOwned.push('hidden');
        if (!g.achievements.includes('sacrifice_100')) g.achievements.push('sacrifice_100');
      }
      if (endingId === 'hidden') {
        if (!g.achievements.includes('reverse_cowboy')) g.achievements.push('reverse_cowboy');
      }
      if (g.skinsOwned.length >= 4 && !g.achievements.includes('father_love')) g.achievements.push('father_love');
      if ((run.conscience || 0) >= 20 && !g.achievements.includes('clearheaded')) g.achievements.push('clearheaded');
      if (D.GIFTS.every(x => (run.giftsOwned || []).includes(x.id)) && !g.achievements.includes('heartfull')) g.achievements.push('heartfull');
      if (!g.endlessUnlocked) { g.endlessUnlocked = true; this.saveGlobal(g); }
      this.saveGlobal(g);
      run.ended = endingId;
      this.saveRun(run);
      return endingId;
    },

    recordEndless(g, score) {
      if (!Array.isArray(g.endlessBest)) g.endlessBest = [];
      g.endlessBest.push({ score, date: new Date().toISOString().slice(0, 10) });
      g.endlessBest.sort((a, b) => b.score - a.score);
      g.endlessBest = g.endlessBest.slice(0, 5);
      this.saveGlobal(g);
      return g.endlessBest;
    },

    endlessWave(run) {
      const wave = Math.floor((run.score || 0) / 3000) + 1;
      const types = ['timing', 'rapid', 'captcha'];
      const type = types[Math.floor(_rng() * types.length)];
      return {
        wave,
        type,
        name: `第 ${wave} 单 · ${type === 'timing' ? '秒杀时刻' : type === 'rapid' ? '扫货急件' : '人机之战'}`,
        base: 800 + wave * 400,
        taps: 5,
        rate: Math.min(0.9, 0.35 + wave * 0.05),
      };
    },

    endlessSuccess(run, profit) {
      run.score = (run.score || 0) + profit;
      run.money = (run.money || 0) + profit;
      this.addRisk(run, 6);
      return run.score;
    },

    endlessFail(run) {
      run.fails = (run.fails || 0) + 1;
      run.streak = 0;
      this.addRisk(run, 3);
      return run.fails >= 3 || (run.money || 0) < 0;
    },
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = GameEngine;
  else global.GameEngine = GameEngine;
})(typeof window !== 'undefined' ? window : globalThis);
