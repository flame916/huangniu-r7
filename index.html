  <!-- 壳层：读秒条几何 + 饱了么 App 界面 -->
  <script>
// ============================================================================
// rules.js - 网页复刻版的「壳层」纯逻辑（不碰 DOM、不碰判定数值）
//
// 判定与数值一律走 js/game.js 的 GameEngine（唯一来源，73 个用例覆盖它）。
// 这里只管四件事，都能在 node 里直接测：
//   1. 读秒条几何（黄金窗口宽度 / 游标位置）
//   2. 单次点击落点 → 判定档位 → 表现分
//   3. 三局表现分 → 交给引擎的单局 timingScore
//   4. 人机验证（T1-2）的出题数据
//
// 档位阈值与分值必须与 Maker 版 scripts/core/Timing.lua 一致：
//   THRESHOLD.perfect = 0.10s / good = 0.22s / ok = 0.42s
//   SCORE.perfect = 1.0 / good = 0.72 / ok = 0.38
// 改这里就要同步改那边（selftest 会核对这两个常量）。
// ============================================================================

(function (global) {
  const THRESHOLD_MS = { perfect: 100, good: 220, ok: 420 };
  const SCORE = { perfect: 1.0, good: 0.72, ok: 0.38, miss: 0.05 };

  const JUDGES = {
    perfect: { id: 'perfect', label: '正中放号', color: '#FF6A00', score: SCORE.perfect, limitMs: THRESHOLD_MS.perfect },
    good: { id: 'good', label: '取号成功', color: '#FF6A00', score: SCORE.good, limitMs: THRESHOLD_MS.good },
    ok: { id: 'ok', label: '擦边取到', color: '#F09B2A', score: SCORE.ok, limitMs: THRESHOLD_MS.ok },
    miss: { id: 'miss', label: '号被抢光了', color: '#E23234', score: SCORE.miss, limitMs: Infinity },
  };

  const ROUNDS = 3;

  // ---- 落点判定 -------------------------------------------------------------
  // offsetMs：距「放号那一刻」的毫秒差（0 = 正中），与 Maker 版一样按绝对距离分档
  function judgeOf(offsetMs) {
    const abs = Math.abs(Number(offsetMs) || 0);
    if (abs <= JUDGES.perfect.limitMs) return JUDGES.perfect;
    if (abs <= JUDGES.good.limitMs) return JUDGES.good;
    if (abs <= JUDGES.ok.limitMs) return JUDGES.ok;
    return JUDGES.miss;
  }

  // ---- 读秒条几何 -----------------------------------------------------------
  // totalMs：游标从左扫到右的时长（= 引擎 timingTotal）
  // 窗口按「ok 档阈值」画（压进这个带子就算取到），核按「perfect 阈值」画
  function barGeometry(totalMs) {
    const total = Math.max(1, Number(totalMs) || 1);
    const zoneRatio = Math.max(0, Math.min(1, THRESHOLD_MS.ok / total));
    const coreRatio = Math.max(0, Math.min(zoneRatio, THRESHOLD_MS.perfect / total));
    return {
      totalMs: total,
      zoneRatio: zoneRatio,
      coreRatio: coreRatio,
      zoneLeftRatio: 1 - zoneRatio,
      zoneRightRatio: 1,
    };
  }

  // ---- 三局 → 交给引擎的 timingScore --------------------------------------
  // 引擎里 effectiveRate = baseRate + timingScore * 0.4，所以把平均表现分直接喂进去
  function timingScoreOf(results) {
    const list = Array.isArray(results) ? results : [];
    if (list.length === 0) return 0;
    let sum = 0;
    for (const r of list) {
      const key = typeof r === 'string' ? r : (r && r.id);
      const j = (key && JUDGES[key]) || (r && typeof r.score === 'number' ? r : null);
      sum += (j && j.score) || 0;
    }
    return Math.max(0, Math.min(1, sum / list.length));
  }

  // ---- 表现档位 / 结算文案 ---------------------------------------------------
  function performanceTier(score) {
    if (score >= 0.9) return '神之手';
    if (score >= 0.7) return '手速在线';
    if (score >= 0.45) return '勉强够用';
    if (score > 0) return '手在抖';
    return '全程陪跑';
  }

  function verdictText(results) {
    const list = Array.isArray(results) ? results : [];
    const idOf = r => (typeof r === 'string' ? r : (r && r.id));
    const perfect = list.filter(r => idOf(r) === 'perfect').length;
    const miss = list.filter(r => idOf(r) === 'miss').length;
    if (list.length && miss === list.length) return '三局全空，号子在您眼前发光';
    if (perfect > 0) return '正中 ' + perfect + ' 次，老父亲都鼓掌';
    if (miss > 0) return '有点磕碰，但压进了窗口';
    return '稳，手感是对的';
  }

  // ---- 滑块选座（slide）：松手位置离目标越近分越高 ------------------------
  // offsetRatio：松手位置与黄金窗口中心的偏差，0 = 正中；窗口宽度用 SLIDE_WINDOW
  const SLIDE_WINDOW = 0.16;      // 黄金窗口占整条轨道的比例（±8%）
  function slideScoreOf(offsetRatio) {
    const d = Math.abs(Number(offsetRatio) || 0);
    if (d <= SLIDE_WINDOW * 0.25) return 1;                 // 正中核心
    if (d <= SLIDE_WINDOW * 0.5) return SCORE.good;         // 压进窗口
    if (d <= SLIDE_WINDOW) return SCORE.ok;                 // 擦边
    return SCORE.miss;
  }
  function slideJudgeOf(offsetRatio) {
    const v = slideScoreOf(offsetRatio);
    if (v >= 1) return JUDGES.perfect;
    if (v >= SCORE.good) return JUDGES.good;
    if (v >= SCORE.ok) return JUDGES.ok;
    return JUDGES.miss;
  }

  // ---- 验真票（spot）：在 9 张票里挑出真票 --------------------------------
  // hits 挑对、misses 挑错；need 是必须挑出的张数
  function spotScoreOf(hits, misses, need) {
    const n = Math.max(1, Number(need) || 2);
    const h = Math.max(0, Number(hits) || 0);
    const m = Math.max(0, Number(misses) || 0);
    const raw = (h - m * 0.5) / n;
    return Math.max(0, Math.min(1, raw));
  }

  // ---- 凑人头报名（crowd）：拉来的人头越多，中签率越高 --------------------
  // 引擎里 effectiveRate = baseRate + timingScore * 0.4，
  // 所以「人头/目标」直接当 timingScore 喂进去，中签率自然是随人数涨的。
  const CROWD_RATE_BONUS = 0.4;      // 与 js/game.js 里 timingScore 的系数一致
  function crowdScoreOf(hits, need) {
    const n = Math.max(1, Number(need) || 6);
    const h = Math.max(0, Number(hits) || 0);
    return Math.max(0, Math.min(1, h / n));
  }
  function drawRateOf(baseRate, ratio) {
    const b = Math.max(0, Number(baseRate) || 0);
    const r = Math.max(0, Math.min(1, Number(ratio) || 0));
    return Math.min(1, b + r * CROWD_RATE_BONUS);
  }

  // ---- 黄牛反制（report）：举报假票贩子，误报扣分 --------------------------
  // right = 举报中的假票贩子数，wrong = 误报（把正常人举报了），need = 应该举报的数量
  function reportScoreOf(right, wrong, need) {
    const n = Math.max(1, Number(need) || 3);
    const r = Math.max(0, Number(right) || 0);
    const w = Math.max(0, Number(wrong) || 0);
    return Math.max(0, Math.min(1, (r - w) / n));
  }

  // 一批候选帖子：一半是假票贩子，一半是正常转票
  function reportFeedOf(rnd) {
    const r = typeof rnd === 'function' ? rnd : Math.random;
    const SCAM = [
      '内部渠道票，100% 保过，先付款后发码，加 V 详聊',
      '票面 168 我卖 988，先到先得，不议价不接受验票',
      '代拍代抢，稳过，扫码付费，身份证我来搞定',
      'VIP 连座 4 张，实名不是问题，走站外更便宜',
    ];
    const FAIR = [
      '临时有事去不了，原价转，可当面验票',
      '多抢了一张内场，原价出，一证一票',
      '朋友来不了，票面价转，可走平台担保',
      '换场次，原价出，实名信息可当面核验',
    ];
    const pick = arr => arr[Math.floor(r() * arr.length)];
    const cards = [];
    for (let i = 0; i < 4; i++) cards.push({ text: pick(SCAM), scam: true });
    for (let i = 0; i < 4; i++) cards.push({ text: pick(FAIR), scam: false });
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = cards[i]; cards[i] = cards[j]; cards[j] = t;
    }
    return cards;
  }

  // ---- 门店核销（verify）：照着核销码按顺序点数字 --------------------------
  // done = 核销成功的码数，wrongs = 按错次数，need = 要核销几个码
  function verifyScoreOf(done, wrongs, need) {
    const n = Math.max(1, Number(need) || 3);
    const d = Math.max(0, Number(done) || 0);
    const w = Math.max(0, Number(wrongs) || 0);
    return Math.max(0, Math.min(1, (d - w * 0.34) / n));
  }

  // 造码表：每码 4 位数字，数字池固定 0-9（与键盘一致）
  function verifyCodesOf(count, rnd) {
    const r = typeof rnd === 'function' ? rnd : Math.random;
    const out = [];
    for (let i = 0; i < (count || 3); i++) {
      let code = '';
      for (let k = 0; k < 4; k++) code += String(Math.floor(r() * 10));
      out.push(code);
    }
    return out;
  }

  // ---- 代排队（queue）：位置别被挤掉，插队者要拦住 ------------------------
  // 位置从 START 开始、越小越靠前；每 0.7s 自动 +1（后面往前挤）；
  // 插队者出现后 0.7s 内没点「拦住」则位置 +2。
  const QUEUE = { START: 4, DRIFT_MS: 700, CUTTER_MS: 1600, CUT_WINDOW_MS: 700, GOOD_POS: 8, FLOOR: 12 };
  function queueScoreOf(finalPos, blocked, totalCutters) {
    const p = Math.max(0, Number(finalPos) || 0);
    const b = Math.max(0, Number(blocked) || 0);
    const n = Math.max(0, Number(totalCutters) || 0);
    const posScore = Math.max(0, Math.min(1, (QUEUE.FLOOR - p) / (QUEUE.FLOOR - 1)));
    const blockScore = n > 0 ? Math.max(0, Math.min(1, b / n)) : 1;
    return Math.max(0, Math.min(1, posScore * 0.6 + blockScore * 0.4));
  }

  // ---- 验货议价（haggle）：把价压下来，但别谈崩 ----------------------------
  // 卖家有隐藏底价 floor（随机），容忍 gap：出价 >= floor 成交；
  // floor-gap <= 出价 < floor 卖家还价；< floor-gap 直接谈崩。
  function haggleFloorOf(rnd) {
    const r = typeof rnd === 'function' ? rnd : Math.random;
    return 276 + Math.floor(r() * 56);      // 276 ~ 331
  }
  const HAGGLE = { START: 388, TARGET: 300, GAP: 26, ROUNDS: 4, STEP: 30 };

  function haggleReact(offer, floor, gap) {
    const g = gap == null ? HAGGLE.GAP : gap;
    if (offer >= floor) return 'deal';
    if (offer >= floor - g) return 'counter';
    return 'break';
  }

  // startPrice 卖家开价、finalPrice 成交价（没成交传 null）、targetPrice 心理目标价
  function haggleScoreOf(startPrice, finalPrice, targetPrice) {
    if (finalPrice == null) return 0;
    const s = Number(startPrice) || HAGGLE.START;
    const f = Number(finalPrice);
    const t = Number(targetPrice) || HAGGLE.TARGET;
    if (!(f < s)) return 0.15;                 // 没压价，等于白谈
    return Math.max(0, Math.min(1, (s - f) / (s - t)));
  }

  // ---- 号码池（pool）：号是真的，会被拿走、会被别人抢走 -------------------
  // 状态：free（还在） / mine（你抢到） / taken（被别人抢走） / expired（过号作废）
  function poolOf(size, prefix, startNo, rnd) {
    const r = typeof rnd === 'function' ? rnd : Math.random;
    const n = Math.max(1, Number(size) || 12);
    const start = Number(startNo) || (100 + Math.floor(r() * 800));
    const nums = [];
    for (let i = 0; i < n; i++) {
      nums.push({ no: (prefix || 'A') + (start + i), state: 'free' });
    }
    return { prefix: prefix || 'A', start, nums };
  }

  function poolStats(pool) {
    const p = pool || { nums: [] };
    let free = 0, mine = 0, taken = 0, expired = 0;
    let nextFree = null;
    for (const it of p.nums) {
      if (it.state === 'free') { free += 1; if (!nextFree) nextFree = it; }
      else if (it.state === 'mine') mine += 1;
      else if (it.state === 'taken') taken += 1;
      else if (it.state === 'expired') expired += 1;
    }
    const firstNo = p.nums.length ? p.nums[0].no : null;
    const lastNo = p.nums.length ? p.nums[p.nums.length - 1].no : null;
    return {
      total: p.nums.length, free, mine, taken, expired,
      range: firstNo && lastNo ? (firstNo + ' ~ ' + lastNo) : null,   // 本次放号区间
      calling: nextFree ? nextFree.no : null,   // 下一个要叫的号
      myNos: p.nums.filter(it => it.state === 'mine').map(it => it.no),
    };
  }

  function takeNumber(pool, asMine, rnd) {

    const r = typeof rnd === 'function' ? rnd : Math.random;

        if (it.state === 'free') {

          return it.no;
        }
      }
      return null;
    }
    // 被别人抢走：随机挑一个还空着的（更像"别的窗口也在放号"）
    const freeIdx = [];
    p.nums.forEach((it, i) => { if (it.state === 'free') freeIdx.push(i); });
    if (freeIdx.length === 0) return null;
    const pick = freeIdx[Math.floor(r() * freeIdx.length)];
    p.nums[pick].state = 'taken';

  function pruneExpired(pool, nowMs) {

    let n = 0;
    for (const it of p.nums) {
      if (it.state === 'mine' && it.expireAt && it.expireAt <= nowMs) {

        n += 1;
      }
    }

  function expireMyNumber(pool, no) {

    if (v >= 106) return { label: '小幅走高', tone: 'up', sign: '+' + (v - 100) + '%' };
    if (v >= 95) return { label: '横盘不动', tone: 'flat', sign: (v - 100) + '%' };
    return { label: '行情冷淡', tone: 'down', sign: (v - 100) + '%' };
  }
  // gain 实际进账、baseline 开卖前的估值合计
  function marketScoreOf(gain, baseline) {

  function refillPool(pool, size, rnd) {

    const p = pool || poolOf(size, 'A', 100 + Math.floor(r() * 800), r);
    const n = Math.max(1, Number(size) || 12);
    let last = Number(p.start) || 100;

    for (let i = 1; i <= n; i++) {

  // 规则照 js/ui.js 的 buildCaptcha：找字 / 算术 / 方向三种随机出，失败只加风控不改成功率
  const CAPTCHA_CHARS = '韭牛票抢码黄号手速';
  const CAPTCHA_TAUNTS = [
    '验证码：小学生都会，你呢？',
    '这是为了证明您是真人，不是脚本。',
    '看清楚再点，机器人可不会手抖。',
  ];

  function pick(arr, rnd) { return arr[Math.floor(rnd() * arr.length)]; }

  function captchaOf(rnd) {
    const r = typeof rnd === 'function' ? rnd : Math.random;
    const roll = r();
    const taunt = pick(CAPTCHA_TAUNTS, r);

    if (roll < 0.34) {
      const target = pick(CAPTCHA_CHARS.split(''), r);
      const pool = CAPTCHA_CHARS.split('').filter(c => c !== target);
      const need = 2;
      const count = 6;
      const tiles = [];

  // 入场页背景：深夜排队 + 店招光晕 + 雨（纯内联 SVG，不加载任何图片）
  function titleBackground() {
    const far = [];
    let x = -10;
    let seed = 7;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    while (x < 400) {
      const w = 24 + rnd() * 40;
      const h = 60 + rnd() * 150;
      far.push(`<rect x="${x.toFixed(0)}" y="${(360 - h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="#150E08"/>`);
      for (let wy = 360 - h + 12; wy < 350; wy += 18) {
        for (let wx = x + 6; wx < x + w - 8; wx += 14) {
          if (rnd() > 0.62) {
            far.push(`<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="5" height="7" fill="#FFC93C" opacity="${(0.10 + rnd() * 0.18).toFixed(2)}"/>`);
          }
        }
      }
      x += w + 6;
    }

    // 排队的人群：每个人都举着手机在刷新（屏幕光就是"抢号"这件事本身）
    const queue = [];
    for (let i = 0; i < 10; i++) {
      const t = i / 9;                       // 0 = 最远，1 = 最近
      const qx = 12 + i * 41;
      const qh = 74 + t * 46;
      const qy = 838 - qh;
      const head = 9 + t * 4;
      queue.push(`<g opacity="${(0.55 + t * 0.45).toFixed(2)}">
        <circle cx="${qx.toFixed(0)}" cy="${(qy + head).toFixed(0)}" r="${head.toFixed(1)}" fill="#0F0B11" stroke="#FFC93C" stroke-opacity="${(0.10 + t * 0.16).toFixed(2)}" stroke-width="1.1"/>
        <path d="M${(qx - 15 - t * 5).toFixed(0)} ${(qy + qh).toFixed(0)} q0 -${(qh - head * 2).toFixed(0)} ${(15 + t * 5).toFixed(0)} -${(qh - head * 2).toFixed(0)} q${(15 + t * 5).toFixed(0)} 0 ${(15 + t * 5).toFixed(0)} ${(qh - head * 2).toFixed(0)} z" fill="#0F0B11" stroke="#FFC93C" stroke-opacity="${(0.08 + t * 0.12).toFixed(2)}" stroke-width="1.1"/>
        <rect x="${(qx - 5).toFixed(0)}" y="${(qy + 30).toFixed(0)}" width="10" height="15" rx="2" fill="#FFC93C" opacity="${(0.30 + t * 0.35).toFixed(2)}"/>
        <ellipse cx="${qx.toFixed(0)}" cy="${(qy + 37).toFixed(0)}" rx="20" ry="17" fill="url(#glow)" opacity="${(0.22 + t * 0.25).toFixed(2)}"/>
      </g>`);
    }

    const rain = [];
    for (let i = 0; i < 46; i++) {
      const rx = rnd() * 400;
      const ry = rnd() * 780;
      rain.push(`<line x1="${rx.toFixed(0)}" y1="${ry.toFixed(0)}" x2="${(rx - 3).toFixed(0)}" y2="${(ry + 22).toFixed(0)}" stroke="#C9BFA8" stroke-width="1" opacity="${(0.05 + rnd() * 0.10).toFixed(2)}"/>`);
    }

    return `<svg class="title-bg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2E1D0E"/><stop offset="0.55" stop-color="#150E09"/><stop offset="1" stop-color="#0A0705"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#FF9A3C" stop-opacity="0.34"/><stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vig" cx="0.5" cy="0.42" r="0.72">
          <stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.65"/>
        </radialGradient>
        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0A0705" stop-opacity="0"/><stop offset="1" stop-color="#0A0705" stop-opacity="0.96"/>
        </linearGradient>
      </defs>
      <rect width="390" height="844" fill="url(#sky)"/>
      <ellipse cx="255" cy="180" rx="200" ry="150" fill="url(#glow)"/>
      ${far.join('')}
      <!-- 店招：这是他们要抢的那家 -->
      <g>
        <rect x="132" y="392" width="126" height="52" rx="6" fill="#1E1409" stroke="#C4942C" stroke-opacity="0.55"/>
        <text x="195" y="415" text-anchor="middle" font-size="15" font-weight="700" fill="#FFC93C" opacity="0.92" font-family="sans-serif">悬崖火锅</text>
        <text x="195" y="433" text-anchor="middle" font-size="8" fill="#B09A7A" opacity="0.85" font-family="sans-serif">今晚 19:30 放号 · 3 个</text>
        <ellipse cx="195" cy="420" rx="140" ry="60" fill="url(#glow)" opacity="0.5"/>
      </g>
      <rect x="0" y="440" width="390" height="404" fill="#0B0806" opacity="0.34"/>
      <ellipse cx="195" cy="812" rx="260" ry="120" fill="#FF8A3C" opacity="0.10"/>
      ${queue.join('')}
      <g class="rain">${rain.join('')}</g>
      <rect width="390" height="844" fill="url(#vig)"/>
      <rect x="0" y="792" width="390" height="52" fill="url(#fade)"/>
    </svg>`;
  }

  // =========================================================================
  const CN_NUM = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  const CH_SUB = { 1: '火锅店门口', 2: '潮玩门店', 3: '演出场馆', 4: '二手平台' };

  // 章节由节点 id 决定（C1_2 → 第一章），不依赖 run.chapter：
  // 跳章节调试时 run.chapter 可能还没跟着任务表走。
  // 覆盖层节点（X1..X8）没有 C 前缀，按它挂的任务章节算；否则退回序章
  const CH_SUB_BY_KEY = { 1: '火锅店门口', 2: '潮玩门店', 3: '演出场馆', 4: '二手平台' };
  function chapterOfNode(node) {
    const base = chapterOf(node && node.id);
    if (base.key !== 0) return base;
    const t = node && node.taskId ? D.TASKS[node.taskId] : null;
    const m = t && /^ch(\d+)$/.exec(String(t.chapter || ''));
    if (m) {
      const n = parseInt(m[1], 10);
      return { name: '第' + (['零','一','二','三','四','五'][n] || n) + '章', sub: CH_SUB_BY_KEY[n] || '', key: n };
    }
    // 分支/收尾节点（如 X2b）按下一跳节点的章节算
    const nextId = node && node.next;
    if (nextId) return chapterOfNode(D.STORY[nextId]);
    return base;
  }

  function chapterOf(nodeId) {
    const id = String(nodeId || '');
    // 结局节点（END_A / END_B / END_CH1）单独给个"结局"水印
    if (/^END_/.test(id)) {
      const which = id === 'END_A' ? '结局 A · 掌刀人' : id === 'END_B' ? '结局 B · 真相' : '试玩结束';
      return { name: '结 局', sub: which, key: 99 };
    }
    const m = /^C(\d+)/.exec(id);
    if (!m) return { name: '序 章', sub: '序章 · 深夜地铁', key: 0 };
    const n = parseInt(m[1], 10);
    return { name: '第' + (CN_NUM[n] || n) + '章', sub: CH_SUB[n] || '', key: n };
  }

  function hud(run) {
    const lv = levelOf(run);
    const riskCls = (run.risk || 0) >= 60 ? 'danger' : (run.risk || 0) >= 30 ? 'warn' : 'ok';
    return `<div class="hud">
      <div class="cell"><div class="v">¥${esc(run.money || 0)}</div><div class="k">资金</div></div>
      <div class="cell"><div class="v ${riskCls}">${esc(run.risk || 0)}</div><div class="k">风控</div></div>
      <div class="cell"><div class="v">${esc(run.day || 1)}</div><div class="k">天数</div></div>
      <div class="cell"><div class="v">Lv.${(run.level || 0) + 1}</div><div class="k">手速</div></div>
    </div>
    <div class="speedline">手速 Lv.${(run.level || 0) + 1} · 成功率上限 ${Math.round((lv.cap || 0) * 100)}%</div>`;
  }

  let typing = null;   // { full, shown, timer }

  function renderStory() {
    const run = app2.run;
    const node = D.STORY[run.nodeId];
    if (!node) { toast('剧情节点不存在：' + run.nodeId); return; }

    app.innerHTML = '';
    const s = el('div', 'screen dark');
    s.innerHTML = hud(run);

    const isSys = node.speaker === '系统';
    const isNarr = node.speaker === '旁白';
    const chapter = chapterOfNode(node);
    // 章节里第几句（按节点顺序扫一遍，纯展示用）
    let seq = 0, total = 0;
    for (const key of Object.keys(D.STORY)) {
      if (chapterOf(key).key !== chapter.key) continue;
      total += 1;
      if (key === node.id) seq = total;
    }
    const tone = isSys ? 'sys' : isNarr ? 'nar' : 'role';

    const card = el('div', 'talk ' + (isSys ? 'sys ' : '') + 'tone-' + tone);

    // 顶部：章节 + 句序
    const meta = el('div', 'talk-meta');
    meta.innerHTML = `
      <span class="meta-chip">${esc(chapter.name)}</span>
      <span class="meta-chip weak">${esc(chapter.sub || '')}</span>
      <span class="spacer"></span>
      <span class="meta-seq">${seq} / ${total}</span>`;
    card.appendChild(meta);

    const head = el('div', 'talk-head');
    head.innerHTML = `
      <div class="avatar">${isSys ? '父' : esc((node.speaker || '旁白').slice(0, 1))}</div>
      <div class="talk-who">
        <div class="name">${esc(node.speaker || '旁白')}</div>
        <div class="sub">${isSys ? '抢购圣手系统 · 自称老父亲' : esc(chapter.sub)}</div>
      </div>
      <span class="role-tag ${tone}">${isSys ? '系统' : isNarr ? '旁白' : '角色'}</span>`;
    card.appendChild(head);

    const textEl = el('div', 'talk-text');
    card.appendChild(textEl);

    // 关键词高亮：**加粗** 和 「引号内」 都挑出来
    const highlight = raw => {
      let out = esc(raw);
      out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      out = out.replace(/「([^」]*)」/g, '<span class="q">「$1」</span>');
      return out;
    };

    // 打字机
    const full = String(node.text || '');
    const chars = Array.from(full);
    let shown = 0;
    if (typing) clearInterval(typing.timer);
    textEl.innerHTML = '<span class="caret"></span>';
    const markTypedDone = () => {
      if (typing) typing.done = true;
      const adv = s.querySelector('[data-role="advance"]');
      if (adv) adv.textContent = '继续';
      const caret = s.querySelector('.caret');
      if (caret) caret.remove();
    };
    typing = {
      full: chars,
      shown: 0,
      timer: setInterval(() => {
        shown = Math.min(chars.length, shown + 2);
        const visible = chars.slice(0, shown).join('');
        const done = shown >= chars.length;
        textEl.innerHTML = highlight(visible) + (done ? '' : '<span class="caret"></span>');
        if (done) { clearInterval(typing.timer); markTypedDone(); }
      }, 16),
      done: chars.length === 0,
    };
    if (chars.length === 0) markTypedDone();
    const finishTyping = () => {
      if (!typing || typing.done) return false;
      clearInterval(typing.timer);
      textEl.innerHTML = highlight(full);
      markTypedDone();
      return true;
    };
    s.appendChild(card);

    s.appendChild(el('div', 'watermark', esc(chapter.name)));

    const act = el('div', 'actions');
    let advanceFn = null;      // 纯剧情节点才有：点卡片 = 继续
    if (node.type === 'task') {
      const t = D.TASKS[node.taskId];
      const done = (run.tasksCompleted || []).includes(node.taskId);
      const b = el('button', 'btn btn-primary',
        done ? '继续' : '开始「' + esc(t ? t.name : node.taskId) + '」');
      b.onclick = () => {
        if (done) { advanceTo(G.nodeAfter(run, node.id)); return; }
        save();
        buyStart(node.taskId);   // 必须走 buyStart：它负责切 currentTask、算读秒条几何
      };
      act.appendChild(b);
    } else if (node.type === 'choice' && Array.isArray(node.choices)) {
      for (const c of node.choices) {
        const b = el('button', 'btn btn-ghost', esc(c.text));
        b.onclick = () => {
          G.applyChoice(run, c.id);
          save();
          render();
        };
        act.appendChild(b);
      }
    } else if (node.type === 'ending') {
      const isRealEnding = !!node.ending;
      const b = el('button', 'btn btn-primary', isRealEnding ? '回到标题（结局已达成）' : '本章结束');
      b.onclick = () => {
        store.removeItem('hn_run');   // 只清 hnr5_ 前缀，不动原网页版存档
        app2.run = null;
        app2.lastResult = null;
        go('title');
      };
      act.appendChild(b);
    } else {
      const b = el('button', 'btn btn-primary', '显示全文');
      b.setAttribute('data-role', 'advance');
      b.onclick = () => {
        if (finishTyping()) return;
        advanceTo(node.next);
      };
      act.appendChild(b);
      advanceFn = () => {
        if (finishTyping()) return;
        advanceTo(node.next);
      };
    }
    // 对话页给一排小工具（选项页不显示，避免和选项按钮抢点击）
    if (advanceFn) {
      const tools = el('div', 'talk-tools');
      const fast = el('button', 'tool-btn', '⚡ 快进本段');
      fast.onclick = ev => { ev.stopPropagation(); finishTyping(); };
      const skip = el('button', 'tool-btn', '⏭ 直接给结果');
      skip.onclick = () => {
        if (!advanceFn) return;
        advanceFn();
      };
      tools.appendChild(fast);
      tools.appendChild(skip);
      act.insertBefore(tools, act.firstChild);
    }

    s.appendChild(act);

    // 对话卡也能点：没打完就先打完，打完了就继续
    card.onclick = () => { if (advanceFn) advanceFn(); else finishTyping(); };
    app.appendChild(s);
  }

  function advanceTo(nextId) {
    const run = app2.run;
    app2.screen = 'story';        // 跳剧情一定要把屏切回来，否则会停在上一个屏
    // 已站在最后一节 → 收尾，不顺进下一章
    if (run.nodeId === END_AFTER || !nextId || !D.STORY[nextId]) {
      run.nodeId = END_NODE_ID;
      save();
      render();
      return;
    }
    if (STORY_OVERRIDES[run.nodeId]) nextId = STORY_OVERRIDES[run.nodeId];
    if (nextId === run.nodeId) {
      const cur = D.STORY[run.nodeId];
      const t = cur && cur.type === 'task' ? D.TASKS[cur.taskId] : null;
      if (t && !(run.tasksCompleted || []).includes(t.id)) {
        // 多轮任务（如 T3-1 要抢 14 轮）还没打完，直接进下一轮
        buyStart(t.id);
        return;
      }
      toast('这条线走完了');
      render();
      return;
    }
    run.nodeId = nextId;
    save();
    render();
  }

  // =========================================================================
  // 取号小游戏（饱了么壳）
  // =========================================================================
  const buy = {
    taskId: null,
    round: 0,
    results: [],
    phase: 'intro',      // intro | run | judge | done
    t: 0,                // 当前阶段已过毫秒
    totalMs: 1500,
    perfectMs: 400,
    geo: null,
    tapped: false,
    trapOn: false,
    trapUsed: false,
    raf: null,
    last: 0,
    captcha: null,      // T1-2：人机验证的当前题目
    needCaptcha: false,
    shell: 'bao',       // 当前壳：bao（取号）/ bobo（抽签）
    mode: 'timing',     // timing（压窗口）/ rapid（连点抢票）
    boost: { clips: 0, t: 0, need: 3, clipMs: 1200, windowMs: 7000, running: false },
    multi: null,        // 多线抢票：{ lanes, hits, misses, prompts, t, nextAt, lit }
    slide: null,        // 滑块选座：{ pos, target, done }
    crowd: null,        // 凑人头：{ cards, hits, need }
    report: null,       // 黄牛反制：{ cards, right, wrong, need, done }
    verify: null,       // 门店核销：{ codes, idx, pos, done, wrongs, need }
    queue: null,        // 代排队：{ pos, cutters, blocked, active, nextDrift, nextCutter, t }
    haggle: null,       // 验货议价：{ ask, floor, round, offers, closed, finalPrice }
    market: null,       // 出货行情：{ round, gain, sold, baseline, log }
    spot: null,         // 验真票：{ cards, hits, misses, need, done }
    multiPrompts: 6,    // 一次抢票要点亮几次
    multiWindowMs: 760, // 每次点亮持续多久
    taps: 0,            // rapid：本轮连点次数
    rapidMs: 3000,      // rapid：抢票窗口时长
    rapidTarget: 24,    // rapid：满分手速（连点次数）
    store: 0,           // 波波：当前选中的抽签门店（0-based）
    openAt: 0,          // 波波：开签时间戳（毫秒），进场时按"今晚 20:00"算
  };

  // 进局前要过人机验证的任务：取号（T1-1）、VIP 取号（T1-2）、春运（CYG / CYB）
  // 规则照 js/ui.js buildCaptcha；任务表里写「+验证码」的也算
  const CAPTCHA_TASKS = { 'T1-1': true, 'T1-2': true, CYG: true, CYB: true, 'X-3': true };
  function taskNeedsCaptcha(taskId) {
    if (CAPTCHA_TASKS[taskId]) return true;
    const t = D.TASKS[taskId];
    return !!(t && typeof t.minigame === 'string' && t.minigame.indexOf('验证码') >= 0);
  }

  function buyStart(taskId) {
    buy.boost.running = false;
    buy.taskId = taskId;
    buy.round = 0;
    buy.results = [];
    buy.trapUsed = false;
    const run = app2.run;
    const taskCh0 = D.TASKS[taskId] && D.TASKS[taskId].chapter;
    const taskCh = taskCh0;
    buy.shell = taskCh === 'ch2' ? 'bobo'
              : taskCh === 'ch3' ? 'mao'
              : taskCh === 'chunyun' ? 'tie'
              : taskCh === 'ch4' ? 'dao' : 'bao';
    // 引擎按 run.currentTask 记进度；切任务要跟着切，否则打完不给奖励、剧情也不推进
    if (run.currentTask !== taskId) {
      run.currentTask = taskId;
      run.taskProgress = 0;
    }
    buy.totalMs = G.timingTotal(run, taskId);
    buy.geo = R.barGeometry(buy.totalMs);
    const rawMode = (D.TASKS[taskId] && D.TASKS[taskId].mode) || 'timing';
    // 演出票（第三章）改成多线作战：三个场次同时开售，点亮就点
    buy.mode = (['slide', 'spot', 'crowd', 'report', 'verify', 'queue', 'haggle', 'market'].indexOf(rawMode) >= 0) ? rawMode
             : taskCh0 === 'ch3' ? 'multi'
             : rawMode === 'rapid' ? 'rapid' : 'timing';
    buy.taps = 0;
    buy.multi = null;
    if (buy.mode === 'rapid') buy.totalMs = buy.rapidMs;
    if (buy.mode === 'multi') buy.totalMs = buy.multiPrompts * (buy.multiWindowMs + 380);
    const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    buy.meta = {
      callingNo: ri(101, 899),
      queueAhead: ri(1600, 9400),
      waitMin: ri(18, 92),
      pool: ri(6, 42),
      cityQueue: ri(900, 9800),
      joined: ri(2800, 24000),
      chancePct: (0.4 + Math.random() * 2.4).toFixed(1),
      seatLeft: ri(2, 11),
      askPrice: ri(320, 439),
      originPrice: ri(118, 208),
      watchers: ri(38, 340),
      sellerItems: ri(4, 44),
      storeStock: [ri(0, 3), ri(0, 2), ri(0, 4)],
      trainSeat: [ri(1, 9), ri(0, 3), ri(2, 12)],
    };
    if (buy.mode === 'market') {
      buy.totalMs = 0;
      // 背包里没货就塞两件合成战利品，保证这一关能玩
      run.inventory = run.inventory || [];
      if (run.inventory.length === 0) {
        run.inventory.push({ name: '悬崖火锅号', base: 500, held: 0, quality: 'good' });
        run.inventory.push({ name: '夜光鬼火隐藏款', base: 1500, held: 0, quality: 'normal' });
      }
      const baseline = run.inventory.reduce((n, it) => n + G.itemValue(run, it), 0);
      buy.market = { round: 0, gain: 0, sold: 0, baseline, log: [] };
    }
    if (buy.mode === 'haggle') {
      buy.totalMs = 0;
      buy.haggle = {
        ask: (buy.meta && buy.meta.askPrice) || R.HAGGLE.START,
        floor: R.haggleFloorOf(Math.random),
        round: 0, closed: false, finalPrice: null, log: [],
      };
    }
    // 号码池：只有"取号"系任务（饱了么壳）才有真号可抢
    const isQueueTask = (D.TASKS[taskId] && (D.TASKS[taskId].chapter === 'prologue' || D.TASKS[taskId].chapter === 'ch1'));
    // 号池跟着存档走（run.pools），重开游戏也还在
    run.pools = run.pools || {};
    if (isQueueTask) {
      const prefix = /包间|VIP/i.test(String((D.TASKS[taskId] || {}).name || '')) ? 'B' : 'A';
      buy.poolPrefix = prefix;
      if (!run.pools[taskId]) {
        run.pools[taskId] = R.poolOf(buy.meta.pool, prefix, buy.meta.callingNo, Math.random);
      }
      R.pruneExpired(run.pools[taskId], Date.now());   // 进关先清算过号的
      if (R.poolStats(run.pools[taskId]).free === 0) {
        R.refillPool(run.pools[taskId], buy.meta.pool, Math.random);   // 放完了就再放一批
      }
      buy.pool = run.pools[taskId];
      save();
    } else {
      buy.pool = null;
    }
    buy.myNo = null;
    buy.needCaptcha = taskNeedsCaptcha(taskId);
    buy.captcha = buy.needCaptcha ? R.captchaOf(Math.random) : null;
    if (buy.mode === 'queue') {
      buy.totalMs = 9000;
      buy.queue = {
        pos: R.QUEUE.START, posAt: 0, nextDrift: R.QUEUE.DRIFT_MS,
        nextCutter: R.QUEUE.CUTTER_MS, active: false, cutUntil: 0,
        cutters: 0, blocked: 0, t: 0,
      };
    }
    if (buy.mode === 'verify') {
      buy.totalMs = 12000;
      const need = 3;
      const codes = R.verifyCodesOf(need, Math.random);
      const pad = [];
      for (let i = 0; i < 10; i++) pad.push(String(i));
      for (let i = pad.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = pad[i]; pad[i] = pad[j]; pad[j] = t;
      }
      buy.verify = { codes, need, idx: 0, pos: 0, done: 0, wrongs: 0, pad };
    }
    if (buy.mode === 'report') {
      buy.totalMs = 9000;
      const feed = R.reportFeedOf(Math.random);
      buy.report = { cards: feed, right: 0, wrong: 0, need: 3, done: false };
    }
    buyBeginRound();
    if (buy.mode === 'crowd') {
      buy.totalMs = 6000;
      const need = 6;
      const names = ['小雨', '老周', '表妹', '前同事', '健身房教练', '租客', '大学室友', '隔壁阿姨'];
      const used = {};
      const picked = [];
      while (picked.length < need) {
        const k = Math.floor(Math.random() * names.length);
        if (!used[k]) { used[k] = true; picked.push(k); }
      }
      buy.crowd = {
        need,
        names,
        cards: names.map((n, i) => ({ name: n, ok: picked.includes(i), picked: false })),
        hits: 0,
      };
    }
    if (buy.mode === 'slide') {
      buy.totalMs = 6000;
      buy.slide = { pos: 0.5, target: 0.18 + Math.random() * 0.64, done: false };
    }
    if (buy.mode === 'spot') {
      buy.totalMs = 0;
      const need = 2;
      const idx = [];
      while (idx.length < need) {
        const k = Math.floor(Math.random() * 9);
        if (!idx.includes(k)) idx.push(k);
      }
      buy.spot = {
        need,
        cards: Array.from({ length: 9 }, (_, i) => ({ real: idx.includes(i), picked: false })),
        hits: 0, misses: 0, done: false,
      };
    }
    if (buy.mode === 'multi') {
      const hard = !!(D.TASKS[taskId] && D.TASKS[taskId].hard);
      const prompts = hard ? 8 : buy.multiPrompts;
      const winMs = hard ? 560 : buy.multiWindowMs;
      buy.totalMs = prompts * (winMs + 380);
      buy.multi = {
        hits: 0, misses: 0, promptsLeft: prompts,
        lit: -1, litUntil: 0, nextAt: 260, t: 0,
        winMs: winMs,                  // 点亮时长，加速后可加宽
        need: prompts,                 // 本关要点亮的总次数（计数用）
        hard: hard,
      };
    }
    if (buy.needCaptcha) buy.phase = 'captcha';
    go('buy');
  }

  // 验证通过 → 进读秒；失败 → 风控 +10 并换一题（与网页基准一致）
  function captchaFinish(ok) {
    if (!ok) {
      G.addRisk(app2.run, 10);
      save();
      toast('❌ 验证失败！风控 +10');
      buy.captcha = R.captchaOf(Math.random);
      render();
      return;
    }
    G.clearReportFlag(app2.run);
    save();
    buy.phase = 'intro';
    buy.t = 0;
    render();
  }

  function buyBeginRound() {
    buy.phase = 'intro';
    buy.t = 0;
    buy.tapped = false;
    buy.trapOn = false;
    buy.geo = R.barGeometry(buy.totalMs);
  }

  function buyTick(dt) {
    buy.t += dt;

    if (buy.phase === 'intro') {
      if (buy.t >= 700) {
        buy.phase = 'run';
        buy.t = 0;
        // 必须重绘一次：按钮要从「准备取号…（禁用）」切成可点的「立即取号」
        render();
      }
      return;
    }

    if (buy.phase === 'run' && buy.mode === 'queue') {
      const q = buy.queue;
      if (!q) return;
      q.t = buy.t;
      if (q.t >= buy.totalMs) { buySettle(); return; }
      // 后面的人往前挤
      if (q.t >= q.nextDrift) { q.pos += 1; q.nextDrift = q.t + R.QUEUE.DRIFT_MS; render(); }
      // 插队者出现
      if (!q.active && q.t >= q.nextCutter) {
        q.active = true;
        q.cutUntil = q.t + R.QUEUE.CUT_WINDOW_MS;
        q.cutters += 1;
        render();
      }
      // 没拦住 → 掉两位
      if (q.active && q.t >= q.cutUntil) {
        q.active = false;
        q.pos += 2;
        q.nextCutter = q.t + R.QUEUE.CUTTER_MS;
        render();
      }
      return;
    }
    if (buy.phase === 'run' && buy.mode === 'verify') {
      if (buy.t >= buy.totalMs) buySettle();
      return;
    }
    if (buy.phase === 'run' && buy.mode === 'report') {
      if (buy.t >= buy.totalMs) buySettle();      // 时间到按已举报的算
      return;
    }
    if (buy.phase === 'run' && buy.mode === 'crowd') {
      if (buy.t >= buy.totalMs) buySettle();     // 时间到：按已凑到的人头结算
      return;
    }
    if (buy.phase === 'run' && buy.mode === 'slide') {
      if (buy.t >= buy.totalMs) buyTap();     // 超时等于自动松手
      return;
    }
    if (buy.phase === 'run' && buy.mode === 'spot') {
      return;                                  // 验票不靠时间，靠挑对
    }
    if (buy.phase === 'run' && buy.mode === 'multi') {
      const m = buy.multi;
      if (!m) return;
      m.t = buy.t;
      if (m.t >= buy.totalMs) { buySettle(); return; }
      if (m.lit >= 0 && m.t >= m.litUntil) { m.lit = -1; }
      if (m.lit < 0 && m.t >= m.nextAt && m.promptsLeft > 0) {
        m.lit = Math.floor(Math.random() * 3);
        m.litUntil = m.t + m.winMs;
        m.promptsLeft -= 1;
        m.nextAt = m.litUntil + 320;
        render();
      }
      return;
    }

    if (buy.phase === 'run' && buy.mode === 'rapid') {
      if (buy.t >= buy.totalMs) { buySettle(); }
      return;
    }

    if (buy.phase === 'run') {
      // 假按钮：第 2、3 局中途出现（点了就是空手）
      if (buy.round >= 1 && !buy.trapUsed && !buy.trapOn && buy.t > buy.totalMs * 0.35) {
        buy.trapOn = true;
        render();
      }
      if (buy.t >= buy.totalMs + 900) {
        // 超时没按
        buyJudge(R.JUDGES.miss, '手呢？手呢！放号都过了');
      }
      return;
    }

    if (buy.phase === 'judge') {
      if (buy.t >= 1100) {
        if (buy.round + 1 >= R.ROUNDS) {
          buy.phase = 'done';
          buySettle();
        } else {
          buy.round += 1;
          buyBeginRound();
          render();
        }
      }
    }
  }

  function buyJudge(judge, label) {
    if (buy.phase !== 'run') return;
    buy.phase = 'judge';
    buy.t = 0;
    buy.trapOn = false;
    buy.results.push({ id: judge.id, label: label || judge.label });
    render();
  }

  // 手机上按下去要有"手感"：能震就震一下，不能震靠 CSS 的 scale/变色
  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  function buyTap() {
    if (buy.phase !== 'run') return;
    buzz(10);

    if (buy.mode === 'slide') {
      const sl = buy.slide;
      if (!sl || sl.done) return;
      sl.done = true;
      const offset = sl.pos - sl.target;
      const judge = R.slideJudgeOf(offset);
      buy.results = [{ id: judge.id, label: '落点偏差 ' + Math.round(Math.abs(offset) * 100) + '%' }];
      buySettle();
      return;
    }
    if (buy.mode === 'multi') {
      const m = buy.multi;
      if (!m) return;
      if (m.lit >= 0) {
        m.hits += 1;
        m.lit = -1;
        render();
      } else {
        m.misses += 1;
        toast('点早了：场次还没亮');
      }
      return;
    }

    if (buy.mode === 'rapid') {
      buy.taps += 1;
      const p = Math.min(1, buy.taps / buy.rapidTarget);
      const bar = document.querySelector('[data-role="rapidFill"]');
      const num = document.querySelector('[data-role="rapidNum"]');
      if (bar) bar.style.width = (p * 100).toFixed(1) + '%';
      if (num) num.textContent = buy.taps + ' / ' + buy.rapidTarget;
      return;
    }
    const remain = buy.totalMs - buy.t;         // 距「放号那一刻」的毫秒差
    const judge = R.judgeOf(remain);
    buyJudge(judge, judge.label);
  }

  function buyMarketSell(channel) {
    if (buy.phase !== 'run' || buy.mode !== 'market') return;
    const mk = buy.market;
    const run = app2.run;
    if (!mk || !run.inventory || run.inventory.length === 0) { toast('没货可卖了'); buySettle(); return; }
    const res = G.sellItem(run, 0, channel);
    if (!res.ok) { toast('这件卖不掉'); return; }
    mk.gain += res.gain || 0;
    mk.sold += 1;
    mk.round += 1;
    mk.log.push({ channel, gain: res.gain, outcome: res.outcome });
    buzz(12);
    save();
    if (mk.round >= R.MARKET.ROUNDS || !run.inventory.length) { buySettle(); return; }
    G.advanceMarket(run);
    render();
  }

  function buyMarketWait() {
    if (buy.phase !== 'run' || buy.mode !== 'market') return;
    const mk = buy.market;
    const run = app2.run;
    if (!mk) return;
    mk.round += 1;
    G.advanceMarket(run);          // 行情动一轮，手里的货 held+1 会跌价
    save();
    if (mk.round >= R.MARKET.ROUNDS) { buySettle(); return; }
    render();
  }

  function buyHaggleOffer(delta) {
    if (buy.phase !== 'run' || buy.mode !== 'haggle') return;
    const h = buy.haggle;
    if (!h || h.closed) return;
    const offer = Math.max(80, h.ask - delta);
    const react = R.haggleReact(offer, h.floor);
    h.log.push({ offer, react });
    h.round += 1;

    if (react === 'deal') {
      h.closed = true;
      h.finalPrice = offer;
      buzz(16);
      toast('成交 ¥' + offer);
      buySettle();
      return;
    }
    if (react === 'break') {
      h.closed = true;
      h.finalPrice = null;
      buzz(30);
      toast('谈崩了：卖家拉黑你');
      buySettle();
      return;
    }
    // 还价：卖家把价往回拉一半
    h.ask = Math.round((offer + h.floor) / 2);
    buzz(10);
    if (h.round >= R.HAGGLE.ROUNDS) {
      h.closed = true;
      h.finalPrice = null;
      toast('四轮没谈拢，卖家不卖了');
      buySettle();
      return;
    }
    render();
  }

  function buyQueueStep() {
    if (buy.phase !== 'run' || buy.mode !== 'queue') return;
    const q = buy.queue;
    if (!q) return;
    if (buy.t - q.posAt < 220) return;      // 200ms 冷却
    q.posAt = buy.t;
    q.pos = Math.max(1, q.pos - 1);
    buzz(8);
    render();
  }

  function buyQueueBlock() {
    if (buy.phase !== 'run' || buy.mode !== 'queue') return;
    const q = buy.queue;
    if (!q || !q.active) return;
    q.active = false;
    q.blocked += 1;
    q.nextCutter = buy.t + R.QUEUE.CUTTER_MS;
    buzz(16);
    render();
  }

  function buyVerifyKey(d) {
    if (buy.phase !== 'run' || buy.mode !== 'verify') return;
    const vf = buy.verify;
    if (!vf) return;
    const code = vf.codes[vf.idx];
    if (code === undefined) return;
    if (d === code[vf.pos]) {
      vf.pos += 1;
      buzz(8);
      if (vf.pos >= code.length) {
        vf.done += 1;
        vf.idx += 1;
        vf.pos = 0;
        buzz(16);
        render();
        if (vf.done >= vf.need) buySettle();
        return;
      }
    } else {
      vf.wrongs += 1;
      vf.pos = 0;          // 按错重来这一码
      buzz(24);
    }
    render();
  }

  function buyReportTap(i, action) {
    if (buy.phase !== 'run' || buy.mode !== 'report') return;
    const rp = buy.report;
    if (!rp) return;
    const card = rp.cards[i];
    if (!card || card.decided) return;
    card.decided = true;
    card.reported = action === 'report';
    if (action === 'report') {
      if (card.scam) { rp.right += 1; buzz(14); } else { rp.wrong += 1; buzz(30); }
    } else if (card.scam) {
      rp.wrong += 1;    // 放过了贩子，也算错
      buzz(20);
    }
    render();
    if (rp.right + rp.wrong >= rp.need + 1) buySettle();
  }

  function buyCrowdPick(i) {
    if (buy.phase !== 'run' || buy.mode !== 'crowd') return;
    const cr = buy.crowd;
    if (!cr) return;
    const card = cr.cards[i];
    if (!card || card.picked) return;
    if (!card.ok) { toast('这个号已经被别人占用，换一个'); return; }
    card.picked = true;
    cr.hits += 1;
    buzz(10);
    render();
    if (cr.hits >= cr.need) buySettle();
  }

  function buySpotPick(i) {
    if (buy.phase !== 'run' || buy.mode !== 'spot') return;
    const sp = buy.spot;
    if (!sp) return;
    const card = sp.cards[i];
    if (!card || card.picked) return;
    card.picked = true;
    if (card.real) { sp.hits += 1; buzz(14); } else { sp.misses += 1; buzz(4); }
    render();
    if (sp.hits >= sp.need) buySettle();
  }

  function buyTapLane(i) {
    if (buy.phase !== 'run' || buy.mode !== 'multi') return;
    const m = buy.multi;
    if (!m) return;
    if (m.lit === i) {
      m.hits += 1;
      m.lit = -1;
      buzz(12);
      render();
    } else {
      buzz(4);
      toast('点早了：这个场次还没亮');
    }
  }

  function buyTrap() {
    if (buy.phase !== 'run') return;
    buy.trapUsed = true;
    buy.trapOn = false;
    if (buy.mode === 'rapid') {
      buy.taps = 0;
      buySettle();
      return;
    }
    buyJudge(R.JUDGES.miss, '点了假按钮，加价的是别人');
  }

  function buySettle() {
    const run = app2.run;
    let score;
    if (buy.mode === 'queue') {
      const q = buy.queue || { pos: 99, blocked: 0, cutters: 0 };
      score = R.queueScoreOf(q.pos, q.blocked, q.cutters);
      buy.results = [{
        id: score >= 0.85 ? 'perfect' : score >= 0.6 ? 'good' : score >= 0.3 ? 'ok' : 'miss',
        label: '守到第 ' + q.pos + ' 位 · 拦住 ' + q.blocked + '/' + q.cutters,
      }];
    } else if (buy.mode === 'verify') {
      const vf = buy.verify || { done: 0, wrongs: 0, need: 3 };
      score = R.verifyScoreOf(vf.done, vf.wrongs, vf.need);
      buy.results = [{
        id: score >= 0.99 ? 'perfect' : score >= 0.6 ? 'good' : score >= 0.3 ? 'ok' : 'miss',
        label: '核销 ' + vf.done + ' 个 · 按错 ' + vf.wrongs + ' 次',
      }];
    } else if (buy.mode === 'report') {
      const rp = buy.report || { right: 0, wrong: 0, need: 3 };
      score = R.reportScoreOf(rp.right, rp.wrong, rp.need);
      buy.results = [{
        id: score >= 0.99 ? 'perfect' : score >= 0.6 ? 'good' : score >= 0.3 ? 'ok' : 'miss',
        label: '举报 ' + rp.right + ' 个 · 误报 ' + rp.wrong + ' 个',
      }];
    } else if (buy.mode === 'crowd') {
      const cr = buy.crowd || { hits: 0, need: 6 };
      score = R.crowdScoreOf(cr.hits, cr.need);
      buy.results = [{ id: score >= 0.99 ? 'perfect' : score >= 0.6 ? 'good' : score >= 0.3 ? 'ok' : 'miss',
        label: '凑到 ' + cr.hits + ' 个人头' }];
    } else if (buy.mode === 'slide') {
      const sl = buy.slide || { pos: 0, target: 0 };
      score = R.slideScoreOf(sl.pos - sl.target);
    } else if (buy.mode === 'spot') {
      const sp = buy.spot || { hits: 0, misses: 0, need: 2 };
      score = R.spotScoreOf(sp.hits, sp.misses, sp.need);
      const j = score >= 0.9 ? R.JUDGES.perfect : score >= 0.6 ? R.JUDGES.good
              : score >= 0.3 ? R.JUDGES.ok : R.JUDGES.miss;
      buy.results = [{ id: j.id, label: '验出 ' + sp.hits + ' 张真票' + (sp.misses ? ' · 看错 ' + sp.misses + ' 张' : '') }];
    } else if (buy.mode === 'multi') {
      const m = buy.multi || { hits: 0, misses: 0 };
      const denom = Math.max(1, buy.multiPrompts + m.misses);
      score = Math.max(0, Math.min(1, m.hits / denom));
      const j = score >= 0.9 ? R.JUDGES.perfect : score >= 0.6 ? R.JUDGES.good
              : score >= 0.3 ? R.JUDGES.ok : R.JUDGES.miss;
      buy.results = [{ id: j.id, label: '抢到 ' + m.hits + ' 个窗口' }];
    } else if (buy.mode === 'rapid') {
      score = Math.max(0, Math.min(1, buy.taps / buy.rapidTarget));
      const j = score >= 0.9 ? R.JUDGES.perfect : score >= 0.6 ? R.JUDGES.good
              : score >= 0.3 ? R.JUDGES.ok : R.JUDGES.miss;
      buy.results = [{ id: j.id, label: '连点 ' + buy.taps + ' 次' }];
    } else {
      score = R.timingScoreOf(buy.results.map(r => r.id));
    }
    const before = {
      rate: G.getTaskRate(run, buy.taskId),
      cap: levelOf(run).cap,
      money: run.money,
      level: run.level,
    };
    const res = G.rollPurchase(run, buy.taskId, score);
    // 判定结果落到号池上：成功=你拿走一个号，失败=别人抢走一个
    let myNo = null;
    if (buy.pool) {
      if (R.poolStats(buy.pool).free === 0) {
        R.refillPool(buy.pool, (buy.meta && buy.meta.pool) || 12, Math.random);   // 先补号再发号
      }
      if (res.success) {
        myNo = R.takeNumber(buy.pool, true, Math.random);
        buy.myNo = myNo;
        if (myNo) {
          for (const it of buy.pool.nums) {
            if (it.no === myNo) it.expireAt = Date.now() + 10 * 60 * 1000;
          }
        }
      } else {
        R.takeNumber(buy.pool, false, Math.random);
      }
      if (R.poolStats(buy.pool).free === 0) {
        R.refillPool(buy.pool, (buy.meta && buy.meta.pool) || 12, Math.random);
      }
    }
    save();
    app2.lastResult = {
      taskId: buy.taskId,
      myNo,
      results: buy.results.slice(),
      score,
      success: res.success,
      before,
      after: {
        rate: G.getTaskRate(run, buy.taskId),
        money: run.money,
        level: run.level,
        luck: run.luck,
      },
      luckGain: res.luckGain,
      streakBonus: res.streakBonus,
      leveledUp: res.leveledUp,
    };
    go('result');
  }

      });

      const base = (D.TASKS[buy.taskId] && D.TASKS[buy.taskId].baseRate) || 0.08;
      const ratio = R.crowdScoreOf(cr.hits, cr.need);
      wrap.appendChild(el('div', 'multi-hint',
        `人头 ${cr.hits} / ${cr.need} · 预估中签率 ${Math.round(R.drawRateOf(base, ratio) * 1000) / 10}%（人头越多越高）`));
    } else if (buy.mode === 'slide') {
      const sl = buy.slide || { pos: 0.5, target: 0.5 };
      const track = el('div', 'slide-track');
      track.setAttribute('data-role', 'slideTrack');
      const zone = el('div', 'slide-zone');
      zone.style.left = ((sl.target - R.SLIDE_WINDOW) * 100).toFixed(2) + '%';
      zone.style.width = (R.SLIDE_WINDOW * 200).toFixed(2) + '%';
      const core = el('div', 'slide-core');
      core.style.left = ((sl.target - R.SLIDE_WINDOW * 0.25) * 100).toFixed(2) + '%';
      core.style.width = (R.SLIDE_WINDOW * 50).toFixed(2) + '%';
      const knob = el('div', 'slide-knob');
      knob.style.left = `calc(${(sl.pos * 100).toFixed(2)}% - 11px)`;
      track.appendChild(zone);
      track.appendChild(core);
      track.appendChild(knob);

      const moveTo = clientX => {
        const r = track.getBoundingClientRect();
        const p = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
        buy.slide.pos = p;
        knob.style.left = `calc(${(p * 100).toFixed(2)}% - 11px)`;
      };
      track.addEventListener('pointerdown', ev => { moveTo(ev.clientX); track.setPointerCapture(ev.pointerId); });
      track.addEventListener('pointermove', ev => { if (ev.buttons) moveTo(ev.clientX); });
      track.addEventListener('pointerup', ev => moveTo(ev.clientX));

      wrap.appendChild(track);
      wrap.appendChild(el('div', 'multi-hint', '把光标拖到亮起的座位段上，松手确认'));
    } else if (buy.mode === 'spot') {
      const sp = buy.spot || { cards: [], hits: 0, need: 2 };
      const grid = el('div', 'spot-grid');

  // ---- 人机验证卡片 ---------------------------------------------------------
  function renderCaptchaCard() {
    const cap = buy.captcha;
    const card = el('div', 'bao-card captcha-card');
    const head = el('div', 'captcha-inst');
    let instruction = '';
    if (cap.kind === 'word') instruction = `请点击所有「${esc(cap.target)}」字（共 ${cap.need} 个）`;
    else if (cap.kind === 'math') instruction = `${cap.a} + ${cap.b} = ?`;
    else instruction = `请点击指向「${esc(cap.answer)}」的箭头`;
    head.innerHTML = `<b>🤖 人机验证</b><br>${instruction}<br><span class="captcha-taunt">${esc(cap.taunt)}</span>`;
    card.appendChild(head);

    const grid = el('div', 'captcha-grid');
    const finish = ok => captchaFinish(ok);

    if (cap.kind === 'word') {
      let picked = 0;
      for (const ch of cap.tiles) {
        const tile = el('button', 'captcha-tile', esc(ch));
        if (ch === cap.target) tile.setAttribute('data-target', '1');
        tile.onclick = () => {
          if (tile.disabled) return;
          if (ch === cap.target) {
            tile.disabled = true;
            tile.classList.add('hit');
            picked += 1;
            if (picked >= cap.need) finish(true);
          } else {
            finish(false);
          }
        };
        grid.appendChild(tile);
      }
    } else if (cap.kind === 'math') {
      for (const v of cap.options) {
        const tile = el('button', 'captcha-tile', String(v));
        tile.onclick = () => finish(Number(v) === cap.answer);
        grid.appendChild(tile);
      }
    } else {
      for (const d of cap.options) {
        const tile = el('button', 'captcha-tile', d[0]);
        tile.onclick = () => finish(d[1] === cap.answer);
        grid.appendChild(tile);
      }
    }
    card.appendChild(grid);
    return card;
  }

  // =========================================================================
  // 主循环
  // =========================================================================
  function render() {
    if (typing) { clearInterval(typing.timer); typing = null; }
    switch (app2.screen) {
      case 'title': renderTitle(); break;
      case 'story': renderStory(); break;
      case 'buy': renderBuy(); break;
      case 'result': renderResult(); break;
      case 'boost': renderBoost(); break;
      case 'shop': renderShop(); break;
      default: renderTitle();
    }
  }

  // ---- 时钟 ---------------------------------------------------------------
  // rAF 与定时器共用同一个时钟：谁先到就推进到「现在」，不会重复计时。
  // 这样即使某些 WebView 节流 rAF（无头浏览器、后台标签页），读秒条也不会卡死。
  let simAt = 0;

  function advanceClock(now) {
    if (!simAt) { simAt = now; return; }
    let dt = now - simAt;
    if (dt <= 0) return;
    if (dt > 64) dt = 64;      // 掉帧截断，避免一下子跳过整局
    simAt = now;
    step(dt);
  }

  function step(dt) {
    if (app2.screen === 'boost') { boostTick(dt); return; }
    if (app2.screen !== 'buy') return;

    const phaseBefore = buy.phase;
    const roundBefore = buy.round;
    buyTick(dt);

    if (app2.screen !== 'buy') return;
    if (phaseBefore !== buy.phase || roundBefore !== buy.round) return;

    // 每帧只刷新"会动的"东西：读秒、游标、开签横幅
    const clock = document.querySelector('.clock');
    const marker = document.querySelector('.marker');

    if (buy.phase === 'run' && (buy.mode === 'multi' || buy.mode === 'rapid' || buy.mode === 'slide')) {
      if (clock) {
        const remain = Math.max(0, (buy.totalMs - buy.t) / 1000);
        clock.textContent = buy.mode === 'multi' ? remain.toFixed(1) : remain.toFixed(2);
        clock.classList.toggle('hot', remain <= (buy.mode === 'multi' ? 1.5 : 1.0));
      }
      return;
    }

    if (buy.phase === 'run' && buy.mode === 'timing') {
      const remain = Math.max(0, (buy.totalMs - buy.t) / 1000);
      if (clock) {
        clock.textContent = remain.toFixed(2);
        clock.classList.toggle('hot', remain <= 0.6);
      }
      if (marker) {
        const p = Math.min(1, buy.t / buy.totalMs);
        marker.style.left = `calc(${(p * 100).toFixed(2)}% - ${(p * 8).toFixed(2)}px)`;
      }
    } else if (buy.phase === 'intro' && clock) {
      clock.textContent = (buy.totalMs / 1000).toFixed(2);
    }

    if (buy.shell === 'bobo') {
      const cd = document.querySelector('[data-role="countdown"]');
      if (cd) cd.textContent = boboCountdownText();
    }
  }

  function loop() {
    advanceClock(performance.now());
    requestAnimationFrame(loop);
  }

  // ---- 入口 -----------------------------------------------------------------
  if (!load()) app2.run = null;
  render();
  requestAnimationFrame(loop);
  setInterval(() => advanceClock(performance.now()), 16);

  // 付款倒计时（中签后 24 小时）与开签横幅共用 1s 心跳
  setInterval(() => {
    const pay = document.querySelector('[data-role="payLeft"]');
    if (pay && app2.payDeadline) {
      const left = Math.max(0, app2.payDeadline - Date.now());
      const total = Math.floor(left / 1000);
      const h = String(Math.floor(total / 3600)).padStart(2, '0');
      const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
      const sec = String(total % 60).padStart(2, '0');
      pay.textContent = h + ':' + m + ':' + sec;
    }
    if (app2.screen === 'result' && buy.pool && buy.myNo && app2.noDeadline && Date.now() > app2.noDeadline) {
      R.pruneExpired(buy.pool, Date.now());
      const t = document.querySelector('.rows');
      const btn = document.querySelector('.actions .btn-ghost');
      if (btn && btn.textContent.indexOf('已过号') < 0) {
        btn.textContent = '已过号作废，转让失效';
        btn.disabled = true;
        toast('过号作废：这个号不能转让了');
      }
    }
    const noLeft = document.querySelector('[data-role="noLeft"]');
    if (noLeft && app2.noDeadline) {
      const left = Math.max(0, app2.noDeadline - Date.now());
      const mm = String(Math.floor(left / 60000)).padStart(2, '0');
      const ss = String(Math.floor((left % 60000) / 1000)).padStart(2, '0');
      noLeft.textContent = mm + ':' + ss;
      noLeft.style.color = left <= 60000 ? '#FF584A' : '';
    }
    if (app2.screen === 'buy' && buy.shell === 'bobo') {
      const cd = document.querySelector('[data-role="countdown"]');
      if (cd) cd.textContent = boboCountdownText();
    }
  }, 1000);

  // 调试/测试钩子（selftest 与无头浏览器验收用，正常游玩不会碰）
  window.HN = {
    app: app2, buy, rules: R, engine: G,
    startTask: buyStart, tap: buyTap, settle: buySettle, go,
  };
})();

</script>
